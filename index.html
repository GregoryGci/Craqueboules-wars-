const SUMMON = { label:'Pierre d\'âme pleine', rates:{1:22, 2:38, 3:27, 4:10, 5:3} };

/* =====================================================================
   2. RÈGLES PARTAGÉES — petites fonctions pures sur les objets.
   ===================================================================== */
const itemMainVal = it => { const [a,b] = MAIN[it.main]; return Math.round(a + (b-a) * it.lvl / 15); };
const itemBonuses = it => [{ s:it.main, v:itemMainVal(it) }, ...it.subs];
const itemName = it => it.sn || (it.rarity === 'legendaire' ? DOFUS_NAMES : TROPHY_NAMES)[it.main.replace('Pct','')];
const fmtStat = (s,v) => `${STAT[s]} +${v}${PCT.has(s) ? ' %' : ''}`;
const xpNeed = l => 80 + l*35;

function computeStats(m, def){
  const lv = def.level || 1, pwr = pwrAt(lv), k = (.55 + .45 * (lv - 1) / (MAX_LVL - 1)) * pwr;
  const b = { ...m.base }; b.hp *= k; b.atk *= k; b.def *= k;
  if (def.awakened && m.awaken) for (const [s,v] of Object.entries(m.awaken.stats)) b[s] += v;
  if (def.boss){ const bm = def.bossMult || 2.4; b.hp *= bm; b.atk *= 1 + (bm - 1) * .07; }
  if (def.hpMult){ b.hp *= def.hpMult; b.atk *= def.atkMult || 1; }   // monstres des premières vagues
  const flat = { hp:0, atk:0, def:0, spd:0, crit:0, critDmg:0, acc:0, res:0 }, pct = { hp:0, atk:0, def:0 };
  // Les apports chiffrés (PV, ATK, DEF, VIT) suivent la même courbe que les stats de base, sinon un trophée
  // ou une pièce d'équipement ne pèserait plus rien passé les premiers niveaux. Les pourcentages, eux, ne bougent pas.
  const SCALED = { hp:1, atk:1, def:1, spd:1 };
  for (const it of def.items || []) for (const st of itemBonuses(it)){
    if (st.s.endsWith('Pct')) pct[st.s.slice(0,-3)] += st.v;
    else flat[st.s] += st.v * (SCALED[st.s] ? k : 1);
  }
  for (const g of def.gear || []){ const st = gearStats(g); for (const q in st) if (q in flat) flat[q] += st[q] * (SCALED[q] ? k : 1); }
  return {
    hp: Math.round(b.hp*(1+pct.hp/100) + flat.hp), atk: Math.round(b.atk*(1+pct.atk/100) + flat.atk),
    def: Math.round(b.def*(1+pct.def/100) + flat.def), spd: Math.round(b.spd + flat.spd),
    crit: Math.min(100, b.crit + flat.crit), critDmg: b.critDmg + flat.critDmg, acc: b.acc + flat.acc, res: b.res + flat.res,
  };
}

/* =====================================================================
   3. MOTEUR DE COMBAT — logique pure, aucun DOM, RNG à graine.
   ===================================================================== */
const Engine = (() => {
  const POS = { A:[{x:14,y:58},{x:30,y:72},{x:46,y:86}], B:[{x:56,y:22},{x:72,y:36},{x:88,y:50}] };
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  function makeUnit(def, side, i){
    const m = MONSTERS[def.key];
    const stats = computeStats(m, def);
    const swap = (def.awakened && m.awaken && m.awaken.swap) || {};
    const skills = m.skills.map(s => swap[s] || s), skl = {};
    skills.forEach((id, k) => { skl[id] = (def.sk && def.sk[k]) || 1; });
    return { id: side + i, side, key: def.key, name: m.name, short: m.short, el: m.el, role: m.role, boss: !!def.boss,
      level: def.level, awakened: !!def.awakened, gear: def.items || [], pos: POS[side][i], stats, hp: stats.hp,
      atb: 0, alive: true, effects: [], cds: {}, skills, skl };
  }
  function createBattle(teamA, teamB, seed){
    return { A: teamA.map((d,i)=>makeUnit(d,'A',i)), B: teamB.map((d,i)=>makeUnit(d,'B',i)),
      rng: mulberry32(seed), seed, turn: 0, actor: null, over: false, winner: null };
  }
  // Vague suivante : l'équipe A garde ses PV, effets et recharges ; de nouveaux ennemis remplacent les morts
  function nextWave(s, teamB, healPct = 0){
    s.B = teamB.map((d,i) => makeUnit(d,'B',i)); s.over = false; s.winner = null; s.actor = null;
    for (const u of s.A) if (u.alive) u.hp = Math.min(u.stats.hp, Math.round(u.hp + u.stats.hp * healPct/100));
  }
  const all = s => s.A.concat(s.B);
  const byId = (s,id) => all(s).find(u => u.id === id);
  const mates = (s,u) => s[u.side].filter(x => x.alive);
  const foes  = (s,u) => s[u.side === 'A' ? 'B' : 'A'].filter(x => x.alive);
  const has = (u,t) => u.effects.some(e => e.type === t);
  const effSpd = u => u.stats.spd * (1 + (has(u,'spdUp') ? .3 : 0) - (has(u,'slow') ? .3 : 0));
  const isAdv = (a,t) => BEATS[a.el] === t.el;
  const isDis = (a,t) => BEATS[t.el] === a.el;
  const fxSnap = u => u.effects.map(e => ({ type:e.type, turns:e.turns }));

  function advance(s){
    const live = all(s).filter(u => u.alive);
    let best = null, bestT = Infinity;
    for (const u of live){
      const t = Math.max(0, (100 - u.atb) / (effSpd(u) * ATB_RATE));
      if (t < bestT - 1e-9 || (Math.abs(t - bestT) < 1e-9 && (u.atb > best.atb || (u.atb === best.atb && effSpd(u) > effSpd(best))))) { best = u; bestT = t; }
    }
    for (const u of live) u.atb = Math.min(100, u.atb + effSpd(u) * ATB_RATE * bestT);
    best.atb = 100;
    return best;
  }
  function preview(s, n){
    const sim = all(s).filter(u => u.alive).map(u => ({ id:u.id, atb:u.atb, r:effSpd(u)*ATB_RATE }));
    const out = [];
    for (let k = 0; k < n && sim.length; k++){
      let best = null, bestT = Infinity;
      for (const u of sim){ const t = Math.max(0,(100-u.atb)/u.r); if (t < bestT - 1e-9 || (Math.abs(t-bestT) < 1e-9 && u.atb > best.atb)) { best = u; bestT = t; } }
      for (const u of sim) u.atb = Math.min(100, u.atb + u.r*bestT);
      out.push(best.id); best.atb = 0;
    }
    return out;
  }
  function beginTurn(s, actor){
    const ev = [];
    s.turn++; s.actor = actor;
    for (const k in actor.cds) if (actor.cds[k] > 0) actor.cds[k]--;
    if (has(actor,'stun')){ ev.push({ t:'stunned', id:actor.id }); endTurn(s, actor, ev); return { skipped:true, events:ev }; }
    return { skipped:false, events:ev };
  }
  function addEffect(s, tgt, type, turns, ev){
    const ex = tgt.effects.find(e => e.type === type);
    if (ex) ex.turns = Math.max(ex.turns, turns);
    else tgt.effects.push({ type, turns, fresh: tgt === s.actor });
    ev.push({ t:'fx', id:tgt.id, effects:fxSnap(tgt), added:type, turns });
  }
  function hit(s, att, tgt, op, ev){
    const rng = s.rng;
    const atk = att.stats.atk * (has(att,'atkUp') ? 1.5 : 1);
    const def = tgt.stats.def * (has(tgt,'defUp') ? 1.7 : 1) * (has(tgt,'defBreak') ? .3 : 1);
    // L'ancienne formule divisait l'attaque par la défense : les deux montant ensemble, les dégâts restaient
    // figés autour de 25 à tous les niveaux. Désormais les dégâts suivent l'attaque, et la défense se lit comme
    // un pourcentage de réduction — calculé sur la défense rapportée au niveau, donc comparable d'un bout à l'autre.
    const dref = def / pwrAt(tgt.level), cut = Math.min(.75, dref / (dref + 160));
    let dmg = atk * op.mult * DMG_K * (1 - cut);
    const adv = isAdv(att,tgt), dis = isDis(att,tgt);
    let crit = false, glance = false;
    if (dis && rng() < .5){ glance = true; dmg *= .7; }
    else if (rng()*100 < att.stats.crit + (op.critBonus||0) + (adv ? 15 : 0)){ crit = true; dmg *= 1 + att.stats.critDmg/100; }
    if (adv) dmg *= 1.15; if (dis) dmg *= .9;
    dmg = Math.round(dmg * (.95 + rng()*.1));
    tgt.hp = Math.max(0, tgt.hp - dmg);
    ev.push({ t:'dmg', id:tgt.id, amount:dmg, crit, glance, adv, dis, hp:tgt.hp });
    if (tgt.hp <= 0){ tgt.alive = false; tgt.atb = 0; tgt.effects = []; ev.push({ t:'death', id:tgt.id }); }
  }
  function resolveTargets(s, actor, sk, targetId){
    if (sk.target === 'enemy')      return [byId(s,targetId) || foes(s,actor)[0]].filter(u => u && u.alive && u.side !== actor.side);
    if (sk.target === 'allEnemies') return foes(s,actor);
    if (sk.target === 'allAllies')  return mates(s,actor);
    return [actor];
  }
  function act(s, actor, skillId, targetId){
    const ev = [], sk = SKILLS[skillId], rng = s.rng, lv = actor.skl[skillId] || 1, pw = 1 + SK_STEP * (lv - 1);
    const targets = resolveTargets(s, actor, sk, targetId);
    ev.push({ t:'skill', id:actor.id, skill:skillId, targets:targets.map(u => u.id) });
    for (const op of sk.ops){
      for (const tgt of targets){
        if (!tgt.alive) continue;
        if (op.op === 'dmg'){ for (let h = 0; h < (op.hits||1) && tgt.alive; h++) hit(s, actor, tgt, pw === 1 ? op : { ...op, mult:op.mult * pw }, ev); }
        else if (op.op === 'debuff'){
          if (rng()*100 >= op.chance) continue;
          if (rng()*100 < Math.max(15, tgt.stats.res - actor.stats.acc)) ev.push({ t:'resist', id:tgt.id });
          else addEffect(s, tgt, op.type, op.turns, ev);
        }
        else if (op.op === 'buff') addEffect(s, tgt, op.type, op.turns, ev);
        else if (op.op === 'heal'){
          const amt = Math.min(tgt.stats.hp - tgt.hp, Math.round(tgt.stats.hp * op.pct * pw / 100));
          tgt.hp += amt; ev.push({ t:'heal', id:tgt.id, amount:amt, hp:tgt.hp });
        }
        else if (op.op === 'atb'){
          if (tgt === actor) continue;
          tgt.atb = Math.max(0, Math.min(100, tgt.atb + op.amount));
          ev.push({ t:'atb', id:tgt.id, atb:tgt.atb, delta:op.amount });
        }
        else if (op.op === 'cleanse'){
          let n = op.n, changed = false;
          for (let i = tgt.effects.length-1; i >= 0 && n > 0; i--) if (!EFFECTS[tgt.effects[i].type].good){ tgt.effects.splice(i,1); n--; changed = true; }
          if (changed) ev.push({ t:'fx', id:tgt.id, effects:fxSnap(tgt), cleansed:true });
        }
      }
    }
    actor.cds[skillId] = sk.cd - (lv >= SK_MAX && sk.cd > 0 ? 1 : 0);
    if (actor.alive) endTurn(s, actor, ev);
    checkOver(s, ev);
    return ev;
  }
  function endTurn(s, actor, ev){
    actor.atb = 0;
    actor.effects = actor.effects.filter(e => { if (e.fresh){ e.fresh = false; return true; } return --e.turns > 0; });
    ev.push({ t:'fx', id:actor.id, effects:fxSnap(actor) });
    ev.push({ t:'atb', id:actor.id, atb:0, reset:true });
    s.actor = null;
  }
  function checkOver(s, ev){
    if (!s.B.some(u => u.alive)){ s.over = true; s.winner = 'A'; }
    else if (!s.A.some(u => u.alive)){ s.over = true; s.winner = 'B'; }
    if (s.over) ev.push({ t:'end', winner:s.winner });
  }
  function aiChoose(s, u){
    const team = mates(s,u), enemies = foes(s,u);
    let best = null;
    u.skills.forEach((id, i) => {
      if (u.cds[id] > 0) return;
      const sk = SKILLS[id]; let score = i*12;
      for (const op of sk.ops){
        if (op.op === 'heal'){ const low = Math.min(...team.map(m => m.hp/m.stats.hp)); score += low < .55 ? 80 : low < .8 ? 10 : -60; }
        if (op.op === 'buff'){ const lacking = team.filter(m => !has(m,op.type)).length; score += lacking >= Math.min(2, team.length) ? 20 : -40; }
        if (op.op === 'atb' && op.amount > 0) score += team.length > 1 ? 15 : -30;
        if (op.op === 'cleanse' && team.some(m => m.effects.some(e => !EFFECTS[e.type].good))) score += 25;
      }
      if (!best || score > best.score) best = { id, score };
    });
    let target = null;
    if (SKILLS[best.id].target === 'enemy'){
      const val = t => (1 - t.hp/t.stats.hp)*1.2 + (isAdv(u,t) ? .6 : 0) - (isDis(u,t) ? .4 : 0) + (has(t,'defBreak') ? .3 : 0) - (t.boss ? .2 : 0);
      target = enemies.slice().sort((a,b) => val(b) - val(a))[0].id;
    }
    return { skill:best.id, target };
  }
  function validTargets(s, actor, skillId){
    const t = SKILLS[skillId].target;
    return t === 'self' ? [actor] : (t === 'allAllies' ? mates(s,actor) : foes(s,actor));
  }
  return { createBattle, nextWave, advance, preview, beginTurn, act, aiChoose, validTargets, all, byId, effSpd, isAdv, isDis };
})();

/* =====================================================================
   4. ÉCONOMIE — sauvegarde, butin, trophées, invocation, éveil.
   Fonctions pures sur l'objet `save` (aucun DOM).
   ===================================================================== */
const Eco = (() => {
  const R = Math.random;
  const pick = a => a[Math.floor(R()*a.length)];
  const randInt = (a,b) => a + Math.floor(R()*(b-a+1));
  const weighted = obj => { let tot = 0; for (const k in obj) tot += obj[k]; let r = R()*tot; for (const k in obj){ r -= obj[k]; if (r < 0) return k; } return Object.keys(obj)[0]; };
  const rollSub = s => randInt(...SUB[s]);
  const monByUid = (save, uid) => save.monsters.find(m => m.uid === uid);
  const itemById = (save, id) => save.items.find(i => i.id === id);

  // want : liste d'effets principaux voulus (raids, dragons) ; l'emplacement en découle
  function genItem(save, rarity, slot, lvl, want){
    let main;
    if (want){
      const opts = [];
      for (const sl in SLOT_MAINS) for (const m of SLOT_MAINS[sl]) if (want.includes(m)) opts.push([+sl, m]);
      [slot, main] = pick(opts);
    } else { slot = slot || randInt(1,6); main = pick(SLOT_MAINS[slot]); }
    const subs = [];
    while (subs.length < RAR_SUBS[rarity]){
      const s = pick(Object.keys(SUB).filter(k => k !== main && !subs.some(x => x.s === k)));
      subs.push({ s, v:rollSub(s) });
    }
    const sk = pickSkin(rarity, lvl || 10, want && rarity === 'legendaire' ? main : null);
    return { id: save.nextId++, slot, rarity, main, lvl:0, subs, owner:null, ...(sk ? { sn:sk.n, si:sk.i } : {}) };
  }
  // Tire un équipement au niveau voulu : on prend une pièce proche de ce niveau, puis chaque ligne fait son jet.
  function genGear(save, lvl, slot){
    const slots = slot ? [GEAR_SRC[slot] || slot] : Object.keys(GEAR_BY_SLOT);
    const pool = GEAR_BY_SLOT[pick(slots)] || [];
    if (!pool.length) return null;
    const near = pool.filter(g => Math.abs(g.l - lvl) <= Math.max(12, lvl * .35));
    const def = pick(near.length ? near : pool);
    const lines = def.e.map(([c, a, b]) => ({ c, a, b, v: a === b ? a : a + Math.floor(R() * (b - a + 1)) }));
    return { id: save.nextId++, g: def.id, s: def.s, lines, jet: gearJet(lines), owner: null };
  }
  const gearById = (save, id) => (save.gear || []).find(g => g.id === id);

    if (!role){ let r = h0 % 100; for (const [n, w] of ROLE_W){ if ((r -= w) < 0){ role = n; break; } } role = role || 'Attaquant'; }
    const R = ROLE[role], s = stars;
    const base = { hp:Math.round((560 + 110*s) * R.hp), atk:Math.round((60 + 5.5*s) * R.atk), def:Math.round((38 + 6*s) * R.def),
      spd:96 + (h0 >>> 8) % 12 + R.spd, crit:15 + R.crit, critDmg:50 + 5*s, acc:10 + R.acc, res:15 + R.res };
    const n = (s >= 3 || role === 'Boss') ? 3 : 2;
    const skills = KIT[role].slice(0, n).map(([target, cd, ops], i) => {
      const id = key + '_' + i, sp = c.sp && c.sp[i];
      SKILLS[id] = { name:(cat.spells && sp && cat.spells[sp]) || GEN_NAMES[role][i], cd, target, desc:descOf(target, ops), ops, ic:icons[sp] || 0 };
      return id;
    });

  }

  for (const d of cat.dungeons.slice().sort((a,b) => a.l - b.l || a.id - b.id)){
    const ms = d.m.map(id => 'm' + id).filter(k => MONSTERS[k]);
    const bossK = (d.b || []).map(id => 'm' + id).find(k => MONSTERS[k]);
    const normals = [...new Set(ms.filter(k => k !== bossK && MONSTERS[k].role !== 'Boss'))];
    if (!bossK && !normals.length) continue;

    const enemies = bossK
      ? [{ key:pickN(0), level:Math.max(1, L-1) }, { key:bossK, level:Math.min(MAX_LVL, L+1), boss:true, bossMult:Math.min(2.4, 1.3 + L/150) }, { key:pickN(1), level:L }]
      : [{ key:pickN(0), level:Math.max(1, L-1) }, { key:pickN(1), level:L }, { key:pickN(2), level:L }];

      desc: bossK ? `Boss : ${MONSTERS[bossK].name}. Niveau Dofus conseillé : ${d.l}.` : `Niveau Dofus conseillé : ${d.l}.`, enemies, ...rewardsFor(L) });

// Monstres invocables : une sélection volontairement courte (les autres restent des ennemis), pour pouvoir en ajouter plus tard.
// Les 1 à 3 étoiles servent surtout de nourriture à XP ; ROSTER_5 liste les 5 étoiles retenus.
const ROSTER_N = { 1:25, 2:30, 3:35, 4:40, 5:20 };
const ROSTER_5 = ['bouftou royal','tofu royal','kardorim','meulou','crocabulia','chêne mou','dragon cochon','minotoror','wa wabbit','maître corbac','royalmouth','bworker','kimbo','kolosso','ombre','merkator','comte harebourg','skeunk','rat noir','sphincter cell'];
let ROSTER = null;   // null hors catalogue : tout est invocable
function buildRoster(cat){
  const inDg = new Set(), lv = k => MONSTERS[k].dofusLvl || 0;
  for (const d of cat.dungeons) if (!/^expédition/i.test(d.n)) for (const id of d.m) inDg.add('m' + id);
  const byName = {};   // un seul exemplaire par nom : de préférence celui d'un vrai donjon, au plus bas niveau
  for (const k of Object.keys(MONSTERS).sort((a,b) => (inDg.has(b) - inDg.has(a)) || lv(a) - lv(b))){ const n = MONSTERS[k].name.toLowerCase(); if (!byName[n]) byName[n] = k; }
  const uniq = Object.values(byName), out = new Set();
  for (const st of [1,2,3,4,5]){
    const cand = uniq.filter(k => MONSTERS[k].stars === st), picked = cand.filter(k => MONSTERS[k].hand);
    if (st === 5) for (const n of ROSTER_5){ const k = byName[n]; if (k && MONSTERS[k].stars === 5 && !picked.includes(k)) picked.push(k); }
    const rest = cand.filter(k => !picked.includes(k)).sort((a,b) => lv(a) - lv(b)), pref = rest.filter(k => inDg.has(k));
    const need = Math.max(0, ROSTER_N[st] - picked.length), pool = pref.length >= need ? pref : rest;
    for (let i = 0; i < need && pool.length; i++) picked.push(pool[Math.floor(i * pool.length / need)]);   // répartis sur toute l'échelle de niveaux
    picked.slice(0, ROSTER_N[st]).forEach(k => out.add(k));

}
function pickSkin(rarity, lvl, main){
  if (main){ const n = DOFUS_NAMES[main.replace('Pct','')]; return ITEM_SKINS.legend.find(i => i.n === n) || null; }   // Dofus d'un dragon : toujours le sien
  const pool = rarity === 'legendaire' ? ITEM_SKINS.legend : ITEM_SKINS.normal;
  if (!pool.length) return null;
  const near = pool.filter(i => Math.abs(i.l - lvl) <= 30), p = near.length ? near : pool;
  return p[Math.floor(Math.random() * p.length)];
}
function starterKeys(){
  if (CAT_MODE === 'local') return ['tofu','larve','chafer'];
  const byName = n => [...(ROSTER || [])].find(k => MONSTERS[k].name.toLowerCase() === n) || Object.keys(MONSTERS).find(k => MONSTERS[k].name.toLowerCase() === n);
  const want = ['tofu','larve bleue','chafer lancier'].map(byName);
  const spare = Object.keys(MONSTERS).filter(k => (!ROSTER || ROSTER.has(k)) && MONSTERS[k].stars <= 2 && MONSTERS[k].role !== 'Boss');
  return want.map((k, i) => k || spare[i] || Object.keys(MONSTERS)[i]);
}

/* =====================================================================
   6 bis. MODES DE JEU — campagne, raids (trophées) et dragons (Dofus).
   Un donjon de campagne se joue en 5 salles (celles du vrai donjon), un raid ou un dragon en 3 vagues :
   des monstres affaiblis d'abord, le boss à la fin.
   Les survivants récupèrent une partie de leurs PV entre deux vagues.

let CAT = null;

const RAID_DEFS = [
  { k:'meulou', boss:/^meulou$/,      mains:['atk','atkPct','crit','critDmg'], tag:'trophées offensifs (ATK, critiques)' },
  { k:'croca',  boss:/^crocabulia$/,  mains:['spd','acc','res'],               tag:'trophées de vitesse, précision et résistance' },
  { k:'chene',  boss:/^chêne mou$/,   mains:['hp','hpPct','def','defPct'],     tag:'trophées défensifs (PV, DEF)' },

const DRAGON_DEFS = [

  { k:'kolosso',   boss:/^kolosso$/,       stat:'def' },

// rooms : nombre de vagues, la dernière étant `last`. En donjon (5 salles), les deux premières salles n'ont que 2 monstres.
function wavesFor(pool, L, last, rooms = 3){

  const w = i => Array.from({ length: rooms > 3 && i < 2 ? 2 : 3 }, (_, k) => ({ key:p[(i+k) % p.length], level:clampL(L - (i < n/2 ? 2 : 1)), ...TRASH }));

const roomMap = (dg, w) => dg.maps && dg.maps.length ? dg.maps[Math.round(w * (dg.maps.length - 1) / Math.max(1, dg.waves.length - 1))] : dg.mapId;

  const out = [], keys = Object.keys(MONSTERS), strong = keys.filter(k => MONSTERS[k].stars >= 4);
  defs.forEach((D, di) => {
    const named = keys.filter(k => D.boss.test(MONSTERS[k].name.toLowerCase())).sort((a,b) => (MONSTERS[a].dofusLvl || 0) - (MONSTERS[b].dofusLvl || 0));
    const bossK = named.find(k => MONSTERS[k].role === 'Boss') || named[0] || strong[di % (strong.length || 1)] || keys[0];   // sans catalogue : un monstre fort fait office de boss
    const src = CAT && CAT.dungeons.find(d => (d.b || []).some(id => 'm' + id === bossK));
    let pool = src ? [...new Set(src.m.map(id => 'm' + id).filter(k => MONSTERS[k] && k !== bossK && MONSTERS[k].role !== 'Boss'))] : [];
    if (!pool.length) pool = keys.filter(k => k !== bossK && MONSTERS[k].stars <= 3 && MONSTERS[k].role !== 'Boss').slice(di*2, di*2 + 4);
    if (!pool.length) pool = [bossK];
    const place = src ? src.n : `Repaire de ${MONSTERS[bossK].name}`, bn = MONSTERS[bossK].name;
    for (let f = 1; f <= floors; f++){
      const L = clampL(lv0 + f * lvStep), id = `${mode}:${D.k}:${f}`;
      const last = [{ key:pool[(f+1) % pool.length], level:clampL(L-1) }, { key:bossK, level:clampL(L+1), boss:true, bossMult:mult0 + f*multStep }, { key:pool[(f+2) % pool.length], level:L }];
      const rw = rewardsFor(L), raid = mode === 'raid';
      out.push({ id, mode, grp:D.k, gname:place, short:`Étage ${f}`, name:`${place} · étage ${f}`, map:src ? themeFor(src.n, src.id) : 'grotte', mapId:src ? src.mp || 0 : 0, lvl:L, dofusLvl:0,
        desc: raid ? `${bn} lâche des ${D.tag}.` : `${bn} garde le ${DOFUS_NAMES[D.stat]} (${STAT_LONG[D.stat]}).`,
        enemies:last, waves:wavesFor(pool, L, last), req:f > 1 ? `${mode}:${D.k}:${f-1}` : null,

}
// Campagne : un niveau par donjon, joué en ROOMS salles (celles du vrai donjon) ; le boss attend dans la dernière
function finalizeStages(){
  const camp = [];
  let prev = null;
  for (const d of DUNGEONS){
    if (d.rarity.legendaire){ d.rarity.heroique = (d.rarity.heroique || 0) + d.rarity.legendaire; delete d.rarity.legendaire; }   // les Dofus ne tombent que sur les dragons
    const pool = d.pool && d.pool.length ? d.pool : [...new Set(d.enemies.filter(e => !e.boss).map(e => e.key))];
    const id = `camp:${d.id}`;
    camp.push({ id, mode:'camp', grp:d.id, gname:d.name, short:d.name, name:d.name, lvl:d.lvl, dofusLvl:d.dofusLvl || 0, map:d.map, mapId:d.mapId || 0, maps:d.maps || null,
      desc:d.desc, enemies:d.enemies, waves:wavesFor(pool, d.lvl, d.enemies, ROOMS), req:prev, kamas:d.kamas, xp:d.xp, ess:d.ess, rarity:d.rarity });
    prev = id;

  STAGES.camp = camp;
  STAGES.raid = bossStages(RAID_DEFS, 'raid', 10, 19, 1.25, .12, 10);   // 1er étage au niveau 29 : il faut avoir fait un bout de campagne et s'être équipé

// ---------- Succès : chaque palier atteint se réclame contre des pierres d'âme pleines (palier n → n pierres)

// État d'un succès : palier en cours, progression, et s'il peut être réclamé
function achState(save, a){
  const got = save.ach[a.id] || 0, v = a.val(save), done = got >= a.tiers.length, goal = a.tiers[Math.min(got, a.tiers.length - 1)];

   6 ter. ARÈNE ET BOSS MONDIAL — contenu quotidien, remis à zéro chaque jour (heure locale).

const GOLD_ICON = 13025, SCROLL_ICON = 15842;   // icônes DofusDB : Parchemin Doré, parchemin de sort
const ARENA_NAMES = ['Brutor le Têtu','Zélie Longue-Vue','Kragnar','Mimosa','Tibald le Prudent','Oriane','Grobul','Sylvestre','Nyx','Capitaine Pataplouf'];
const ARENA_SHOP = [

  { id:'stone',  name:'Pierre d\'âme pleine',         desc:'Une invocation.',                           cost:15, give:s => { s.stones++; } },
  { id:'kamas',  name:'5 000 kamas',                  desc:'Pour forger tes trophées.',                 cost:10, give:s => { s.kamas += 5000; } },
  { id:'ess',    name:'20 essences de chaque élément', desc:'Pour éveiller tes monstres.',              cost:8,  give:s => { for (const e in s.ess) s.ess[e] += 20; } },

const dayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const strHash = t => [...t].reduce((h, c) => (Math.imul(h, 31) + c.charCodeAt(0)) | 0, 7);
const topMons = (save, n) => save.monsters.slice().sort((a,b) => MONSTERS[b.key].stars * 100 + b.level - (MONSTERS[a.key].stars * 100 + a.level)).slice(0, n);
// État du jour, recréé à la première visite de la journée ; base = niveau moyen des 3 meilleurs monstres à ce moment-là
function daily(save){
  const day = dayKey();
  if (!save.arena || save.arena.day !== day){
    const top = topMons(save, 3);
    save.arena = { day, base:Math.max(1, Math.round(top.reduce((t, m) => t + m.level, 0) / (top.length || 1))), done:[] };
  }
  if (!save.wb || save.wb.day !== day) save.wb = { day, tries:0, best:(save.wb && save.wb.best) || 0, today:0 };

}
// Les 10 adversaires du jour, du plus faible au plus fort : identiques toute la journée
function arenaFoes(save){
  const A = daily(save).arena, rng = mulberry(strHash(A.day)), keys = Object.keys(MONSTERS).filter(k => MONSTERS[k].role !== 'Boss');
  return ARENA_NAMES.map((name, r) => {
    const lo = Math.min(4, 1 + Math.floor(r / 3)), hi = Math.min(5, 2 + Math.floor(r / 2.5));
    let pool = keys.filter(k => MONSTERS[k].stars >= lo && MONSTERS[k].stars <= hi); if (pool.length < 3) pool = keys;
    const lvl = clampL(A.base - 2 + Math.round(r * .7));
    const team = [0,1,2].map(() => ({ key:pool[Math.floor(rng() * pool.length)], level:lvl, hpMult:1 + r * .05, atkMult:1 + r * .02 }));
    return { r, name, lvl, team, gold:3 + Math.floor(r / 2), kamas:200 + r * 80, done:A.done.includes(r) };
  });
}
// Boss mondial : les 10 meilleurs monstres du joueur contre un boss increvable ; seul le total de dégâts compte

/* =====================================================================

const NET = {

function netInit(){

    sb = window.supabase.createClient(NET.url, NET.key, { auth:{ persistSession:true, autoRefreshToken:true } });

}
async function netSignUp(mail, pass){

async function netSignIn(mail, pass){

  const { data, error } = await sb.auth.signInWithPassword({ email:mail, password:pass });
  if (error) return { err:netErr(error) };

async function netSignOut(){ if (sb) try { await sb.auth.signOut(); } catch(e){} me = null; netState = sb ? 'anon' : 'off'; }
const netErr = e => {
  const m = (e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'Adresse ou mot de passe incorrect.';
  if (m.includes('already registered')) return 'Cette adresse a déjà un compte.';
  if (m.includes('password')) return 'Mot de passe trop court (6 caractères minimum).';
  if (m.includes('email')) return 'Adresse électronique invalide.';
  return e && e.message || 'Le serveur n\'a pas répondu.';
};

async function netPull(){
  if (!netOn()) return null;
  try {
    const { data, error } = await sb.from('saves').select('data, updated_at').eq('user_id', me.id).maybeSingle();
    if (error || !data) return null;
    return data;
  } catch(e){ return null; }
}
async function netPush(force){
  if (!netOn() || !save) return;
  const now = Date.now();
  if (!force && now - lastPush < 4000){                       // on regroupe les envois rapprochés
    clearTimeout(pushT); pushT = setTimeout(() => netPush(true), 4000);
    return;
  }
  lastPush = now; clearTimeout(pushT); pushT = null;
  try { await sb.from('saves').upsert({ user_id:me.id, data:save, updated_at:new Date().toISOString() }, { onConflict:'user_id' }); }
  catch(e){}
}

  for (let i = d.waves.length - 1; i >= 0; i--){ const b = d.waves[i].find(e => e.boss); if (b) return b.key; }
  const w = d.waves[d.waves.length - 1];
  return w && w[0] && w[0].key;
};
const MODE_CARD = {

function viewJouer(){

      art: bk ? portrait(bk, 56, { badge:false }) : '',

      n: L.length ? `${done} / ${L.length} ${C.u} terminés` : 'Bientôt' });
  });
  const foes = arenaFoes(save), won = foes.filter(f => f.done).length;
  cards.push(modeCard({ t:'Arène', s:'Dix duels par jour, payés en parchemins dorés', col:'#b8860b', act:'nav', v:'arene',

  const W = daily(save).wb, B = wbBoss();

function slotCell(mon, n){

        ${confirmBtn('rel'+mon.uid, 'Relâcher', 'Confirmer', 'release')}</div>

// Caractéristiques et sorts : colonne de droite sur grand écran, sous l'équipement sinon
function monStats(mon){
  const m = MONSTERS[mon.key], def = Eco.monDef(save, mon);
  const full = computeStats(m, def), bare = computeStats(m, { ...def, items:[], gear:[] });
  const swap = (m.awaken && m.awaken.swap) || {};
  const skills = m.skills.map(id => mon.awakened && swap[id] ? swap[id] : id);
  const ac = Eco.awakenCost(mon);
  const statRow = (k, suf='') => `<li><span class="lb">${sico(k)}${STAT_LONG[k]}</span><b>${fmt(full[k])}${suf}${full[k] !== bare[k] ? `<em> (+${fmt(full[k]-bare[k])})</em>` : ''}</b></li>`;
  return `<section class="win"><div class="wt"><h2>Caractéristiques</h2></div>
    <div class="wb" style="display:grid; gap:8px">
      <ul class="rows">${statRow('hp')}${statRow('atk')}${statRow('def')}${statRow('spd')}${statRow('crit',' %')}${statRow('critDmg',' %')}${statRow('acc',' %')}${statRow('res',' %')}</ul>
      <p class="hint" style="margin:0">Entre parenthèses : ce que l'équipement et les trophées ajoutent.</p>
      <div class="band">Sorts</div>
      <ul class="sklist">${skills.map((id, si) => { const lv = (mon.sk && mon.sk[si]) || 1, max = lv >= SK_MAX;
        return `<li>${spellIcon(id, m.el)}<b>${SKILLS[id].name} <span class="sklv">niv. ${lv}/${SK_MAX}</span>${SKILLS[id].cd ? ` <span class="muted" style="font-weight:normal">· recharge ${SKILLS[id].cd - (max ? 1 : 0)} t</span>` : ''}</b>
          <span>${SKILLS[id].desc}${lv > 1 ? ` <b class="pos">+${Math.round(SK_STEP * (lv - 1) * 100)} % d'effet</b>` : ''}</span>
          ${max ? '' : `<span class="skup"><button class="btn sm" data-act="skUp" data-i="${si}" data-w="scroll" ${save.scrolls > 0 ? '' : 'disabled'}>${resIcon(SCROLL_ICON, 14)} Parchemin (${save.scrolls})</button><button class="btn grey sm" data-act="skUp" data-i="${si}" data-w="dup" ${Eco.dupOf(save, mon) ? '' : 'disabled'}>Doublon</button></span>`}</li>`; }).join('')}</ul>
      ${!mon.awakened && m.awaken ? `<p class="hint">Éveil : ${Object.entries(m.awaken.stats).map(([s,v]) => fmtStat(s,v)).join(', ')}${Object.keys(swap).length ? `, ${SKILLS[Object.keys(swap)[0]].name} devient ${SKILLS[Object.values(swap)[0]].name}` : ''}. Coût : ${ac.ess} essences ${ELEM[ac.el]} (tu en as ${save.ess[ac.el]}) et ${fmt(ac.kamas)} kamas.</p>` : ''}
    </div></section>`;
}
function pickRow(it){
  const owner = it.owner != null && Eco.monByUid(save, it.owner);
  return `<button class="prow" style="--rc:var(--r-${it.rarity})" data-act="equip" data-id="${it.id}"><span class="cell r-${it.rarity}">${itemIcon(it)}<span class="lv">+${it.lvl}</span></span><b>${itemName(it)} +${it.lvl}</b>
    <span>${fmtStat(it.main, itemMainVal(it))}${it.subs.length ? ' · ' + it.subs.map(s => fmtStat(s.s,s.v)).join(' · ') : ''}${owner ? ` · sur ${MONSTERS[owner.key].name}` : ''}</span></button>`;
}

function gearCell(mon, sl){

// Une ligne d'effet : la valeur tirée, sa fourchette, et où elle se situe dedans
function gearLineHtml(l){
  const neg = l.v < 0, span = l.b - l.a, r = span ? (l.v - l.a) / span : 1;
  return `<li class="${neg ? 'neg' : 'pos'}"><span>${neg ? '' : '+'}${l.v} ${CHAR_NAME[l.c] || ''}</span>
    <span class="rg">${l.a} à ${l.b}</span><span class="mini"><i style="width:${Math.round(r*100)}%"></i></span></li>`;
}
function gearDetail(it, mon, sl){
  const d = gearDef(it), st = gearStats(it), owner = it.owner != null && Eco.monByUid(save, it.owner);

      <div style="display:grid; gap:7px; min-width:0">

        <span class="muted" style="font-size:11.5px">Apport : ${Object.entries(st).map(([k,v]) => `${v > 0 ? '+' : ''}${fmt(v)} ${STAT_LONG[k] || k}`).join(' · ') || 'aucun'}</span>

      ${confirmBtn('gsell' + it.id, `Vendre · ${fmt(Eco.gearValue(it))} K`, 'Confirmer', 'gsell')}</div>
  </div>`;
}
// Panneau d'un emplacement : l'objet porté, puis les pièces compatibles du sac
function gearPanel(mon){
  const sl = gearPick, src = GEAR_SRC[sl] || sl;
  const id = mon.g && mon.g[sl], it = id ? Eco.gearById(save, id) : null;
  const others = (save.gear || []).filter(g => g.s === src && g.id !== id)
    .sort((a,b) => (a.owner != null) - (b.owner != null) || gearLvl(b) - gearLvl(a) || b.jet - a.jet);
  const rows = others.map(g => {
    const own = g.owner != null && Eco.monByUid(save, g.owner);
    return `<button class="grow" data-act="gequip" data-v="${sl}" data-id="${g.id}">
      <span class="box ${JET_CLASS(g.jet)}">${gearIcon(g, 34)}</span>
      <span style="display:grid; min-width:0"><b>${esc(gearName(g))}</b>
        <span class="sub">Niv. ${gearLvl(g)} · ${(g.lines || []).slice(0,3).map(l => `${l.v > 0 ? '+' : ''}${l.v} ${CHAR_NAME[l.c] || ''}`).join(' · ')}${own ? ` · sur ${esc(MONSTERS[own.key].name)}` : ''}</span></span>
      <span class="q ${JET_CLASS(g.jet)}" style="color:inherit">${Math.round(g.jet*100)} %</span></button>`;
  }).join('');
  return `${it ? gearDetail(it, mon, sl) : ''}
    <div class="panel picker"><div class="band"><span>${GEAR_LABEL[sl]}</span><span class="muted" style="color:#d9d4c4">${others.length} en réserve</span></div>
      <div class="glist">${rows || '<span class="muted">Aucune pièce pour cet emplacement. Va en campagne pour en trouver.</span>'}</div></div>`;
}

// Emplacement ouvert depuis la fiche du monstre : améliorer, vendre, retirer et changer se font ici,
// sans détour par l'inventaire (les objets libres d'abord, puis ceux portés par un autre monstre)
function slotPanel(mon){
  const n = slotPick, id = mon.equip[n], it = id ? Eco.itemById(save, id) : null;
  const others = () => save.items.filter(i => i.slot === n && i.id !== id)
    .sort((a,b) => (a.owner != null) - (b.owner != null) || RARITIES.indexOf(b.rarity) - RARITIES.indexOf(a.rarity) || b.lvl - a.lvl);
  const rows = msg => { const l = others(); return l.length ? l.map(pickRow).join('') : `<span class="muted">${msg}</span>`; };
  if (!it) return `<div class="panel picker"><div class="band"><span>Emplacement ${n}</span><span class="muted">vide</span></div>
    ${rows('Aucun objet pour cet emplacement. Va en donjon pour en trouver.')}</div>`;
  return `<div class="panel picker">
    <div class="band slate"><span>${itemKind(it)} · emplacement ${n}</span><span>${RAR_LABEL[it.rarity]}</span></div>
    ${itemFace(it)}
    <div class="panel" style="overflow:hidden">${itemEffects(it)}</div>
    ${upgradeBtn(it)}
    <div class="row">
      <button class="btn grey" data-act="swap" aria-pressed="${swapOpen}">${swapOpen ? 'Annuler' : 'Changer'}</button>
      <button class="btn grey" data-act="unequip" data-id="${it.id}">Retirer</button>

    ${swapOpen ? `<div class="band"><span>Remplacer par</span></div>${rows('Aucun autre objet pour cet emplacement.')}` : ''}</div>`;
}

// ---------- Séquence d'invocation : la pierre se charge, la couleur grimpe palier par palier jusqu'au nombre d'étoiles tiré, puis elle éclate
const STAR_COL = { 1:'#c9c4b2', 2:'#6fcf4b', 3:'#4a9cf0', 4:'#b06aff', 5:'#ffb21a' };
const STAR_WORD = { 1:'Commun', 2:'Peu commun', 3:'Rare', 4:'Épique', 5:'Légendaire' };
let sumBusy = false, actx = null;
// Petit son synthétisé (aucun fichier) ; silencieux si le navigateur refuse
function blip(freq, dur = .14, type = 'sine', vol = .05, when = 0){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch(e){}
}
// rs : un tirage ou une liste de tirages (×10) ; la montée de couleur suit alors le meilleur de la série
async function summonShow(rs){
  if (fxOff) return;   // animations réduites : le résultat s'affiche directement dans la page
  sumBusy = true;
  rs = [].concat(rs);
  const multi = rs.length > 1, r = rs.reduce((a, b) => MONSTERS[b.mon.key].stars > MONSTERS[a.mon.key].stars ? b : a);
  const m = MONSTERS[r.mon.key], st = m.stars;
  const o = document.createElement('div'); o.className = 'sumov';
  o.innerHTML = `<div class="sumrays"></div>
    <div class="sumstage"><div class="sumstone">${gemIcon('perfect', 150)}</div>
      <div class="sumres" hidden>${multi ? '<div class="sumgrid"></div>' : portrait(r.mon.key, 230, { badge:false })}<div class="sumstars"></div><h3></h3><p></p>
        <div class="sumbtns" hidden><button class="btn" data-sum="again">Invoquer encore</button><button class="btn" data-sum="again10">Invoquer ×10</button>${multi ? '' : '<button class="btn grey" data-sum="see">Voir la fiche</button>'}<button class="btn grey" data-sum="close">Continuer</button></div></div></div>
    <div class="sumflash"></div><p class="sumhint">Touche l'écran pour passer</p>`;
  document.body.appendChild(o);
  let skip = false, done = false;
  const close = () => { o.classList.add('out'); setTimeout(() => o.remove(), 260); sumBusy = false; };
  o.addEventListener('click', e => {
    const b = e.target.closest('[data-sum]');
    if (!done){ skip = true; return; }
    close();
    if (b && b.dataset.sum === 'again') ACT.summon();
    else if (b && b.dataset.sum === 'again10') ACT.summon10();
    else if (b && b.dataset.sum === 'see') ACT.seeMon({ uid:r.mon.uid });
  });
  const w = ms => skip ? Promise.resolve() : new Promise(res => { const t0 = Date.now(), id = setInterval(() => { if (skip || Date.now() - t0 >= ms){ clearInterval(id); res(); } }, 30); });
  const ring = () => { const x = document.createElement('span'); x.className = 'sumring'; o.appendChild(x); setTimeout(() => x.remove(), 650); };
  // 1. Charge : des éclats d'âme convergent vers la pierre
  for (let i = 0; i < 18; i++){
    const a = Math.random()*6.283, d = 160 + Math.random()*220, x = document.createElement('span');
    x.className = 'summote'; x.style.cssText = `--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--d:${(.7 + Math.random()*.6).toFixed(2)}s;--dl:${(Math.random()*.9).toFixed(2)}s`;
    o.appendChild(x);
  }
  blip(196, .5, 'triangle', .04); await w(750);
  // 2. Montée : un palier de couleur par étoile, de plus en plus tendu
  for (let k = 2; k <= st; k++){
    o.style.setProperty('--c', STAR_COL[k]); ring(); blip(196 * 2 ** ((k - 1) * 4 / 12), .25, 'triangle', .06);
    if (k >= 4) o.classList.add('tense');
    await w(k >= 4 ? 700 : 480);
  }
  o.classList.add('tense'); await w(st >= 4 ? 520 : 320);
  // 3. Éclatement et révélation
  o.classList.remove('tense'); o.classList.add('burst'); ring();
  if (st >= 4){ o.classList.add('quake'); }
  [0, 4, 7, 12].slice(0, Math.max(2, st - 1)).forEach((semi, i) => blip(392 * 2 ** (semi / 12), .5, 'sine', .06, i * .07));
  await w(260);
  o.querySelector('.sumstone').hidden = true;
  const res = o.querySelector('.sumres'); res.hidden = false;
  for (let i = 0; i < (st >= 3 ? st * 22 : 0); i++){
    const a = Math.random()*6.283, d = 140 + Math.random()*Math.max(innerWidth, innerHeight)*.55, x = document.createElement('span');
    x.className = 'sumconf';
    x.style.cssText = `--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d + 160}px;--r:${Math.round(Math.random()*1080 - 540)}deg;--d:${(1.2 + Math.random()*1.1).toFixed(2)}s;background:${[STAR_COL[st], '#fff', '#ffd66a', STAR_COL[Math.max(1, st - 1)]][i % 4]}`;
    o.appendChild(x); setTimeout(() => x.remove(), 2400);
  }
  await w(520);
  const stars = res.querySelector('.sumstars');
  if (multi){   // ×10 : les cartes tombent une à une, bordées de la couleur de leur palier
    stars.hidden = true;
    const grid = res.querySelector('.sumgrid');
    for (const x of rs){
      const mm = MONSTERS[x.mon.key], c = document.createElement('span');
      c.className = 'sumcard' + (mm.stars >= 4 ? ' hot' : ''); c.style.setProperty('--c', STAR_COL[mm.stars]);
      c.innerHTML = `${portrait(x.mon.key, 70, { badge:false })}<b>${starsTxt(mm.stars)}</b><small>${mm.name}</small>${x.isNew ? '<i>Nouveau</i>' : ''}`;
      grid.appendChild(c); blip(520 * 2 ** (mm.stars * 3 / 12), .14, mm.stars >= 4 ? 'triangle' : 'square', mm.stars >= 4 ? .07 : .035);
      if (mm.stars >= 4) ring();
      await w(mm.stars >= 4 ? 420 : 170);
    }
    const news = rs.filter(x => x.isNew).length;
    res.querySelector('h3').textContent = `${rs.length} invocations`;
    res.querySelector('p').innerHTML = `Meilleur tirage : ${m.name} (${st} étoiles)${news ? `<span class="sumnew">${news} nouveau${news > 1 ? 'x' : ''}</span>` : ''}`;
  } else {
    for (let i = 0; i < st; i++){ const x = document.createElement('span'); x.textContent = '★'; stars.appendChild(x); blip(660 * 2 ** (i * 2 / 12), .16, 'square', .035); await w(170); }
    res.querySelector('h3').textContent = m.name;
    res.querySelector('p').innerHTML = `${STAR_WORD[st]} · ${ELEM[m.el]} · ${m.role}${r.isNew ? '<span class="sumnew">Nouveau !</span>' : ''}`;
  }
  if (rs.some(x => x.isNew)) blip(1320, .3, 'sine', .05, .1);
  await w(350);
  const btns = res.querySelector('.sumbtns'); btns.hidden = false;
  if (save.stones < 1) btns.querySelector('[data-sum="again"]').disabled = true;
  if (save.stones < 10) btns.querySelector('[data-sum="again10"]').disabled = true;
  o.querySelector('.sumhint').textContent = `${save.stones} pierre${save.stones > 1 ? 's' : ''} d'âme pleine${save.stones > 1 ? 's' : ''} restante${save.stones > 1 ? 's' : ''}`;
  done = true;
}

const plain = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function encyMons(){
  const q = plain(ency.q.trim());
  return Object.keys(MONSTERS).filter(k => { const m = MONSTERS[k]; return (!q || plain(m.name).includes(q)) && (!ency.stars || m.stars === ency.stars) && (!ency.el || m.el === ency.el) && (!ency.inv || !ROSTER || ROSTER.has(k)); })

// Page suivante d'objets (ou première page si reset) ; seule la dernière requête lancée est prise en compte
function encyFetch(reset){
  if (reset){ ency.items = []; ency.total = null; }
  const my = ++ency.req, q = plain(ency.q.trim());
  ency.loading = true; ency.err = false;
  const url = `${API_BASE}/items?$limit=${ENCY_PAGE}&$skip=${ency.items.length}&$sort[level]=1&$select[]=id&$select[]=name&$select[]=level&$select[]=iconId&$select[]=typeId&$select[]=description`
    + (q ? `&slug.fr[$search]=${encodeURIComponent(q)}` : '') + (ency.type ? `&typeId=${ency.type}` : '');
  fetch(url).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
    if (my !== ency.req) return;
    ency.items.push(...(d.data || []).map(x => ({ id:x.id, n:(x.name && (x.name.fr || x.name.en)) || '?', l:x.level || 1, i:x.iconId, t:(x.type && x.type.name && x.type.name.fr) || '', d:(x.description && x.description.fr) || '' })));

// ---------- Auto-run : l'équipe enchaîne des combats joués par l'IA en arrière-plan, pendant que le joueur fait autre chose
const AUTO_N = 10;
let autoRun = null;   // { on, dg, team, total, done, wins, kamas, stones, items, ups, msg, res, dur, timer }
// Combat complet sans affichage : mêmes règles et même IA que le mode Auto en combat
function simulate(dg, team, seed){
  const st = Engine.createBattle(team, dg.waves[0], seed);
  let w = 0;
  for (let guard = 0; guard < 6000; guard++){
    if (st.over){
      if (st.winner === 'A' && w < dg.waves.length - 1){ Engine.nextWave(st, dg.waves[++w], WAVE_HEAL); continue; }
      break;
    }
    const a = Engine.advance(st);
    if (Engine.beginTurn(st, a).skipped) continue;
    const c = Engine.aiChoose(st, a); Engine.act(st, a, c.skill, c.target);
  }
  return { win:st.winner === 'A', turns:st.turn, wave:w };
}
function autoStart(dg, total = AUTO_N){
  if (autoRun && autoRun.on) return toast('Une série automatique est déjà en cours.');
  if (!teamMons().length) return toast('Ajoute au moins un monstre à ton équipe.');
  autoRun = { on:true, dg, team:save.team.slice(), total, done:0, wins:0, kamas:0, stones:0, items:[], ups:0, msg:'', res:null, dur:0, timer:0 };
  toast(`Série automatique lancée : ${dg.name}.`);
  autoNext(); if (!inCombat) render();
}
function autoNext(){
  const a = autoRun; if (!a || !a.on) return;
  const mons = a.team.map(uid => Eco.monByUid(save, uid)).filter(Boolean);
  if (!mons.length) return autoEnd('Les monstres de la série ont été relâchés.');
  a.res = simulate(a.dg, mons.map(m => Eco.monDef(save, m)), (Math.random() * 2**31) | 0);
  a.dur = Math.max(4000, Math.min(30000, a.res.turns * 160));   // le résultat tombe après la durée approximative d'un vrai combat
  a.timer = setTimeout(autoFinish, a.dur); renderAuto();
}
function autoFinish(){
  const a = autoRun; if (!a || !a.on) return;
  a.done++;
  if (!a.res.win) return autoEnd(`Défaite au combat ${a.done} (${waveWord(a.dg).toLowerCase()} ${a.res.wave + 1} / ${a.dg.waves.length}).`, true);
  const L = Eco.loot(save, a.dg, a.team);
  a.wins++; a.kamas += L.kamas; a.stones += L.stones; a.items.push(...L.items); a.ups += L.xp.reduce((t, x) => t + x.ups, 0);
  persist(); renderTop();
  if (a.done >= a.total) return autoEnd('Série terminée.');
  if (!inCombat && view === 'donjons') render();
  autoNext();
}
function autoEnd(msg, bad){
  const a = autoRun; clearTimeout(a.timer); a.on = false; a.msg = msg; a.bad = !!bad;
  renderAuto(); toast(`Auto : ${msg}`);
  if (!inCombat) render();
}
function renderAuto(){
  let box = $('#autobox');
  if (!autoRun){ if (box) box.hidden = true; return; }
  if (!box){ box = document.createElement('aside'); box.id = 'autobox'; box.className = 'win autobox'; box.setAttribute('aria-label', 'Série automatique'); document.body.appendChild(box); }
  const a = autoRun, byR = {};
  for (const it of a.items) byR[it.rarity] = (byR[it.rarity] || 0) + 1;
  box.hidden = false;
  box.innerHTML = `<div class="wt"><h2>Auto<small>${a.done} / ${a.total}</small></h2>${a.on ? '' : '<button class="x" data-act="autoClose" title="Fermer" aria-label="Fermer">×</button>'}</div>
    <div class="wb"><b>${a.dg.name}</b>
      ${a.on ? `<div class="xpbar autobar"><b style="animation-duration:${a.dur}ms"></b></div><span class="muted">Combat ${a.done + 1} / ${a.total} en cours…</span>` : `<span class="${a.bad ? 'neg' : 'ok'}">${a.msg}</span>`}
      <ul class="autoloot">
        <li>${a.wins} victoire${a.wins > 1 ? 's' : ''}${a.ups ? ` · ${a.ups} niveau${a.ups > 1 ? 'x' : ''} gagné${a.ups > 1 ? 's' : ''}` : ''}</li>
        <li>${kamaIcon(12)} ${fmt(a.kamas)} kamas${a.stones ? ` · ${gemIcon('perfect', 14)} ${a.stones}` : ''}</li>
        <li>${a.items.length} objet${a.items.length > 1 ? 's' : ''}${a.items.length ? ' : ' + RARITIES.filter(r => byR[r]).map(r => `<b style="color:var(--r-${r})">${byR[r]} ${RAR_LABEL[r].toLowerCase()}</b>`).join(', ') : ''}</li>
      </ul>
      <div class="row" style="justify-content:flex-end">${a.on ? '<button class="btn grey sm" data-act="autoStop">Arrêter</button>' : `<button class="btn sm" data-act="autoAgain">Relancer ×${a.total}</button>`}</div></div>`;
}

// ---------- Arène : 10 PNJ par jour, parchemins dorés à la clé, et la boutique qui va avec
let arTab = 'duel';
const foeChips = team => team.map(e => `<span class="fchip" title="${esc(MONSTERS[e.key].name)}">${portrait(e.key, 34, { badge:false })}</span>`).join('');
function arenaFight(r){
  const f = arenaFoes(save)[r]; if (!f || f.done) return;
  startCombat({ id:'arena:' + r, mode:'arena', name:`Arène · ${f.name}`, map:'champs', mapId:0, lvl:f.lvl, enemies:f.team, waves:[f.team], back:'arene',
    finish(win){
      if (!win) return '<p class="hint" style="padding:0 8px">Aucune récompense : tu peux retenter ce duel aujourd\'hui.</p>';
      const A = daily(save).arena; if (A.done.includes(r)) return '';
      A.done.push(r); save.gold += f.gold; save.kamas += f.kamas; save.wins = (save.wins || 0) + 1;
      return `<div class="band">Récompense</div><div class="lootrow"><span class="cell r-legendaire" title="Parchemins dorés">${resIcon(GOLD_ICON, 36)}<span class="q">${f.gold}</span></span>
        <span class="cell" title="Kamas">${kamaIcon(34)}<span class="lv">${fmt(f.kamas)}</span></span></div>`;
    } });
}
function viewArene(){
  const tabs = backToModes + `<div class="row modes">${[['duel','Duels du jour'],['shop','Boutique'],['rta','Joueurs (RTA)']].map(([k,l]) => `<button class="btn grey sm" data-act="arTab" data-v="${k}" aria-pressed="${arTab === k}">${l}</button>`).join('')}</div>`;
  if (arTab === 'shop') return tabs + `<section class="win"><div class="wt"><h2>Boutique de l'arène<small>${save.gold} parchemins dorés</small></h2></div><div class="wb">
    <ul class="shop">${ARENA_SHOP.map(o => `<li><span class="achn"><b>${o.name}</b><br><span class="muted">${o.desc}</span></span>
      <button class="btn sm" data-act="arBuy" data-id="${o.id}" ${save.gold >= o.cost ? '' : 'disabled'}>${resIcon(GOLD_ICON, 14)} ${o.cost}</button></li>`).join('')}</ul></div></section>`;
  if (arTab === 'rta') return tabs + `<section class="win"><div class="wt"><h2>Joueurs (RTA)</h2></div><div class="wb"><p style="margin:0">Les combats en direct contre d'autres joueurs demandent un serveur en ligne (comptes, salons). Ce mode s'ouvrira quand le jeu y sera relié.</p></div></section>`;
  const foes = arenaFoes(save), team = teamMons(), left = foes.filter(f => !f.done).length;
  return tabs + `<section class="win"><div class="wt"><h2>Duels du jour<small>${foes.length - left} / ${foes.length} gagnés</small></h2></div><div class="wb" style="display:grid; gap:8px">
    <p class="muted" style="margin:0">Dix adversaires par jour, calés sur le niveau de tes meilleurs monstres. Chaque victoire rapporte des parchemins dorés ; la liste change à minuit.</p>
    <ul class="shop">${foes.map(f => `<li class="${f.done ? 'done' : ''}"><span class="lvn">${f.r + 1}</span><span class="achn"><b>${f.name}</b> <span class="muted">niv. ${f.lvl}</span><br><span class="fchips">${foeChips(f.team)}</span></span>
      <span class="achr">${f.done ? '<span class="ok">Battu</span>' : `<span class="row" style="gap:6px; flex-wrap:nowrap">${resIcon(GOLD_ICON, 14)} <b>${f.gold}</b><button class="btn sm" data-act="arFight" data-r="${f.r}" ${team.length ? '' : 'disabled'}>Défier</button></span>`}</span></li>`).join('')}</ul></div></section>`;
}

// ---------- Boss mondial : 3 assauts par jour à 10 monstres, récompense selon les dégâts
function wbFight(){
  const W = daily(save).wb; if (W.tries >= WB_TRIES) return toast('Tes 3 assauts du jour sont faits.');
  const B = wbBoss(), bn = MONSTERS[B.key].name;
  W.tries++; persist();   // l'assaut est compté dès le départ : fuir le consomme
  startCombat({ id:'wb', mode:'wb', name:`Boss mondial · ${bn}`, map:'grotte', mapId:B.mapId, lvl:MAX_LVL, enemies:[B.def], waves:[[B.def]], back:'boss',
    forceAuto:true, turnCap:WB_TURNS, endLabel:'Assaut terminé', team:() => topMons(save, WB_TEAM),
    finish(){
      const boss = state.B[0], dmg = Math.max(0, boss.stats.hp - boss.hp), t = wbTier(dmg), W2 = daily(save).wb;
      W2.today = Math.max(W2.today, dmg); W2.best = Math.max(W2.best, dmg);
      save.gold += t.gold; save.kamas += t.kamas; save.stones += t.stones;
      return `<div class="band">Dégâts infligés : ${fmt(dmg)} · rang ${t.rank}</div><div class="lootrow"><span class="cell r-legendaire" title="Parchemins dorés">${resIcon(GOLD_ICON, 36)}<span class="q">${t.gold}</span></span>
        <span class="cell" title="Kamas">${kamaIcon(34)}<span class="lv">${fmt(t.kamas)}</span></span>${t.stones ? `<span class="cell r-heroique" title="Pierres d'âme pleines">${gemIcon('perfect', 36)}<span class="q">${t.stones}</span></span>` : ''}</div>`;
    } });
}
function viewBoss(){
  const W = daily(save).wb, B = wbBoss(), m = MONSTERS[B.key], team = topMons(save, WB_TEAM), cur = wbTier(W.today);
  return backToModes + `<div class="split"><section class="win"><div class="wt"><h2>${esc(m.name)}<small>boss mondial</small></h2></div><div class="wb" style="display:grid; gap:8px">
      <div class="ehead">${portrait(B.key, 110, { badge:false })}<div><b>${ELEM[m.el]}</b> · increvable<br><span class="muted">L'assaut dure ${WB_TURNS} tours ou jusqu'à la chute de ton équipe. Seul le total de dégâts compte.</span></div></div>
      <ul class="rows"><li><span>Assauts du jour</span><b>${W.tries} / ${WB_TRIES}</b></li><li><span>Meilleur du jour</span><b>${fmt(W.today)}${W.tries ? ` · rang ${cur.rank}` : ''}</b></li><li><span>Record personnel</span><b>${fmt(W.best)}</b></li></ul>
      <div class="band">Ton équipe (${team.length} / ${WB_TEAM})</div>
      <div class="fchips">${team.map(x => `<span class="fchip" title="${esc(MONSTERS[x.key].name)}, niveau ${x.level}">${portrait(x.key, 40, { badge:false })}</span>`).join('') || '<span class="muted">Aucun monstre.</span>'}</div>
      <p class="hint" style="margin:0">Tes 10 meilleurs monstres (étoiles puis niveau) partent automatiquement ; le combat se joue tout seul.</p>
      <footer class="row" style="justify-content:flex-end"><button class="btn" data-act="wbFight" ${W.tries < WB_TRIES && team.length ? '' : 'disabled'}>Lancer l'assaut</button></footer></div></section>
    <section class="win"><div class="wt"><h2>Récompenses</h2></div><div class="wb" style="display:grid; gap:8px">
      <table class="restab"><thead><tr><th>Rang</th><th>Dégâts</th><th>Parchemins dorés</th><th>Kamas</th><th>Pierres</th></tr></thead><tbody>
      ${WB_TIERS.slice().reverse().map(t => `<tr><td><b>${t.rank}</b></td><td>${fmt(t.min)}+</td><td>${t.gold}</td><td>${fmt(t.kamas)}</td><td>${t.stones || '—'}</td></tr>`).join('')}</tbody></table>
      <p class="hint" style="margin:0">Chaque assaut est récompensé selon son rang. Le classement entre joueurs et le boss partagé demandent un serveur en ligne : pour l'instant chacun affronte sa propre instance.</p></div></section></div>`;
}

// ---------- Succès
function viewSucces(){
  const rows = ACHS.map(a => {
    const st = achState(save, a);
    return `<li class="ach ${st.done ? 'done' : st.ready ? 'ready' : ''}">
      <span class="achn"><b>${a.name}</b> <span class="muted">palier ${Math.min(st.got + 1, a.tiers.length)} / ${a.tiers.length}</span><br><span>${a.desc(st.goal)}</span></span>
      <span class="achp"><span class="xpbar"><b style="width:${st.done ? 100 : Math.min(100, st.v / st.goal * 100)}%"></b></span><span class="muted">${st.done ? 'Terminé' : `${fmt(Math.min(st.v, st.goal))} / ${fmt(st.goal)}`}</span></span>
      <span class="achr">${st.done ? '<span class="ok">Tout réclamé</span>' : `<button class="btn sm" data-act="claim" data-id="${a.id}" ${st.ready ? '' : 'disabled'}>${gemIcon('perfect', 14)} +${st.reward}</button>`}</span></li>`;
  }).join('');
  const total = ACHS.reduce((t, a) => t + a.tiers.length, 0), got = ACHS.reduce((t, a) => t + (save.ach[a.id] || 0), 0);
  return `<section class="win"><div class="wt"><h2>Succès<small>${got} / ${total} paliers</small></h2></div>
    <div class="wb"><p class="muted" style="margin:0 0 8px">Chaque palier atteint se réclame contre des pierres d'âme pleines : 1 pour le premier, 2 pour le deuxième, et ainsi de suite.</p>
    <ul class="achs">${rows}</ul></div></section>`;
}

// ---------- Actions
const ACT = {
  arTab(d){ arTab = d.v; render(); },
  arFight(d){ arenaFight(+d.r); },
  arBuy(d){ const o = ARENA_SHOP.find(x => x.id === d.id); if (!o || save.gold < o.cost) return toast('Pas assez de parchemins dorés.'); save.gold -= o.cost; o.give(save); persist(); toast(`Acheté : ${o.name}.`); render(); },
  wbFight(){ wbFight(); },
  mode(d){ mode = d.v; selDg = null; openGrp = null; dq = ''; render(); },
  play(d){ mode = d.v; selDg = null; openGrp = null; dq = ''; view = 'donjons'; render(); window.scrollTo(0,0); },
  grp(d){ openGrp = openGrp === d.k ? null : d.k; const l = $('#dlist'), sc = l.scrollTop; l.innerHTML = dgListHtml(); l.scrollTop = sc; },
  skUp(d){ const r = Eco.skillUp(save, Eco.monByUid(save, selMon), +d.i, d.w); if (r.err) return toast(r.err); persist(); toast(`Sort monté au niveau ${r.lv}.`); render(); },
  eqTab(d){ eqTab = d.v; render(); },
  eKind(d){ ency.kind = d.v; ency.q = ''; ency.n = 60; if (d.v === 'items') ency.total = null; render(); },
  eSel(d){ ency.sel = d.k; render(); },
  eItem(d){ ency.item = ency.items.find(x => x.id === +d.id) || null; render(); },
  eMore(){ if (ency.kind === 'mons'){ ency.n += 120; encyPaint(); } else if (!ency.loading){ encyFetch(false); encyPaint(); } },
  eRetry(){ encyFetch(!ency.items.length); encyPaint(); },
  auto(d){ if (isUnlocked(+d.i)) autoStart(stages()[+d.i]); },
  autoStop(){ if (autoRun && autoRun.on) autoEnd('Série arrêtée.'); },
  autoAgain(){ const a = autoRun; if (a && !a.on){ autoRun = null; autoStart(a.dg, a.total); } },
  autoClose(){ autoRun = null; renderAuto(); },
  claim(d){ const n = achClaim(save, ACHS.find(a => a.id === d.id)); if (!n) return; persist(); toast(`+${n} pierre${n > 1 ? 's' : ''} d'âme pleine${n > 1 ? 's' : ''}.`); render(); },
  nav(d){ if (inCombat){ battleId++; inCombat = false; if (ro) ro.disconnect(); } view = d.v; slotPick = null; gearPick = null; teamPick = null; swapOpen = false; confirmKey = null; upMsg = null; upFx = null; render(); window.scrollTo(0,0); },
  fight(d){ startCombat(+d.i); },
  selDg(d){ selDg = +d.i; render(); },
  refight(){ startCombat(curStage); },
  endAll(){ endAll = true; paintEnd(); },
  nextStage(){ if (endData && endData.next != null) startCombat(endData.next); },
  flee(){ ACT.nav({ v:(curStage && curStage.back) || 'donjons' }); toast('Tu as fui le combat.'); },
  selMon(d){ selMon = +d.uid; slotPick = null; gearPick = null; teamPick = null; swapOpen = false; confirmKey = null; render(); },
  seeMon(d){ selMon = +d.uid; view = 'equipe'; render(); },
  team(){
    const i = save.team.indexOf(selMon);
    if (i >= 0){ save.team.splice(i,1); persist(); return render(); }
    if (save.team.length >= 3){ teamPick = selMon; return render(); }   // pleine : on demande qui remplacer
    save.team.push(selMon); persist(); render();
  },
  teamSwap(d){
    const i = save.team.indexOf(+d.uid);
    if (i >= 0 && teamPick != null) save.team[i] = teamPick;
    teamPick = null; persist(); render();
  },
  teamCancel(){ teamPick = null; render(); },
  awaken(){ const r = Eco.awaken(save, Eco.monByUid(save, selMon)); if (r.err) return toast(r.err); persist(); toast('Éveil réussi.'); render(); },
  release(){
    const k = 'rel' + selMon;
    if (confirmKey !== k){ confirmKey = k; return render(); }
    confirmKey = null;
    const r = Eco.release(save, Eco.monByUid(save, selMon));
    if (r.err){ toast(r.err); return render(); }
    persist(); toast(`Relâché : +${r.kamas} kamas, +${r.ess} essences.`); selMon = null; render();
  },
  // Ouvrir un emplacement vise aussi son objet : « Améliorer » et « Vendre » agissent dessus sans passer par l'inventaire
  slot(d){
    const n = +d.slot, close = slotPick === n;
    slotPick = close ? null : n;
    if (!close){ const id = (Eco.monByUid(save, selMon) || {}).equip?.[n]; if (id) selItem = id; }
    gearPick = null; swapOpen = false; upMsg = null; upFx = null; confirmKey = null; render();
  },
  swap(){ swapOpen = !swapOpen; confirmKey = null; render(); },
  // --- équipement : ouvrir un emplacement ferme l'autre famille, pour ne jamais afficher deux panneaux
  gslot(d){ gearPick = gearPick === d.v ? null : d.v; slotPick = null; swapOpen = false; confirmKey = null; render(); },
  gequip(d){
    const g = Eco.gearById(save, +d.id); if (!g) return;
    Eco.equipGear(save, Eco.monByUid(save, selMon), g, d.v);
    confirmKey = null; persist(); render();
  },
  gunequip(d){
    const mon = Eco.monByUid(save, selMon), id = mon && mon.g && mon.g[d.v];
    const g = id && Eco.gearById(save, id); if (!g) return;
    Eco.unequipGear(save, g); confirmKey = null; persist(); render();
  },
  gsell(){
    const mon = Eco.monByUid(save, selMon), id = mon && mon.g && mon.g[gearPick];
    const g = id && Eco.gearById(save, id); if (!g) return;
    const k = 'gsell' + g.id;
    if (confirmKey !== k){ confirmKey = k; return render(); }
    confirmKey = null;
    const v = Eco.sellGear(save, g);
    persist(); toast(`Vendu pour ${fmt(v)} kamas.`); render();
  },
  equip(d){
    const it = Eco.itemById(save, +d.id);
    Eco.equip(save, Eco.monByUid(save, selMon), it);
    selItem = it.id; swapOpen = false; upMsg = null; upFx = null;   // l'emplacement reste ouvert sur le nouvel objet
    persist(); render();
  },
  unequip(d){ Eco.unequip(save, Eco.itemById(save, +d.id)); slotPick = null; swapOpen = false; persist(); render(); },
  selItem(d){ selItem = +d.id; upFx = null; upMsg = null; confirmKey = null; render(); },
  upgrade(){
    const it = Eco.itemById(save, selItem), r = Eco.upgrade(save, it);
    upFx = r.ok && r.sub ? r.sub : null;
    if (r.err) upMsg = { ok:false, text:r.err };
    else if (!r.ok) upMsg = { ok:false, text:`Échec. ${fmt(r.cost)} kamas perdus, l'objet reste à +${it.lvl}.` };
    else upMsg = { ok:true, text:`Réussi : +${it.lvl}.${r.sub ? (r.sub.added ? ` Nouvel effet : ${STAT[r.sub.s]}.` : ` ${STAT[r.sub.s]} +${r.sub.v}.`) : ''}` };
    persist(); render();
  },
  sell(){
    const k = 'sell' + selItem;
    if (confirmKey !== k){ confirmKey = k; return render(); }
    confirmKey = null; const it = Eco.itemById(save, selItem), v = Eco.sellValue(it);
    Eco.sell(save, it); persist(); toast(`Vendu pour ${v} kamas.`); selItem = null; upMsg = null; slotPick = null; swapOpen = false; render();
  },
  summon10(){
    if (sumBusy) return;
    if (save.stones < 10) return toast('Il te faut 10 pierres d\'âme pleines.');
    const rs = []; for (let i = 0; i < 10; i++) rs.push(Eco.summon(save));
    lastSummon = rs.reduce((a, b) => MONSTERS[b.mon.key].stars > MONSTERS[a.mon.key].stars ? b : a);
    persist(); render(); summonShow(rs);
  },
  summon(){ if (sumBusy) return; const r = Eco.summon(save); if (r.err) return toast(r.err); lastSummon = r; persist(); render(); summonShow(r); },
  copySave(){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
    const box = $('#importBox'), ta = $('#importTxt');
    const fallback = () => { box.hidden = false; ta.value = code; ta.select(); toast('Copie bloquée : le code est sélectionné ci-dessous.'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Sauvegarde copiée.'), fallback); } catch(e){ fallback(); }
  },
  toggleImport(){ const b = $('#importBox'); b.hidden = !b.hidden; },
  doImport(){
    try { const s = JSON.parse(decodeURIComponent(escape(atob($('#importTxt').value.trim())))); if (!s || s.v !== 2 || !Array.isArray(s.monsters)) throw 0;
      save = s; persist(); $('#importBox').hidden = true; toast('Sauvegarde chargée.'); ACT.nav({ v:'donjons' });
    } catch(e){ toast('Code de sauvegarde invalide.'); }
  },
  resetSave(){
    if (confirmKey !== 'reset'){ confirmKey = 'reset'; $('#resetBtn').textContent = 'Confirmer : tout effacer'; return; }
    confirmKey = null; $('#resetBtn').textContent = 'Nouvelle partie';
    save = Eco.newSave(); persist(); selMon = selItem = lastSummon = null; toast('Nouvelle partie.'); ACT.nav({ v:'donjons' });
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  // clic sur le fond d'une modale : on ne ferme que si on a bien cliqué le fond, pas son contenu
  if (b.classList.contains('modal') && e.target.closest('[data-stop]')) return;
  if (confirmKey && !['release','sell','gsell','resetSave','packClear'].includes(b.dataset.act)){ confirmKey = null; $('#resetBtn').textContent = 'Nouvelle partie'; }
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fSlot'){ filt.slot = +t.value; render(); }
  else if (t.id === 'fRar'){ filt.rar = t.value; render(); }

            <button class="btn grey sm" id="autoBtn" aria-pressed="false">Auto</button>

        </section>

        <div class="hudbar">
          <div class="chat" id="chat" aria-label="Journal du combat"><ol id="log"></ol></div>
          <div class="pcirc" id="pcirc"></div>
          <div class="seedrow"><span class="muted" style="font-size:11px">graine ${seed}</span></div>
        </div>
      </div></section>`;
  field = $('#field'); logEl = $('#log');

// Vague nettoyée : les ennemis morts sortent, la vague suivante entre ; l'équipe garde son état
async function nextWave(my){

// ---------- Effets de sorts : particules dessinées sur un canevas au-dessus de l'arène (aucun fichier externe)
// c : [couleur, sombre, clair] · g : gravité des éclats · arc : hauteur de la trajectoire du projectile
const FX_EL = {
  terre:{ c:['#d9a04a','#8a5a26','#f6e0a8'], g:520,  arc:.35, sq:true },
  feu:  { c:['#ff8a2a','#d9301a','#ffe9a0'], g:-160, arc:.08 },
  eau:  { c:['#58b8ff','#1f6fd0','#e2f6ff'], g:380,  arc:.22 },
  air:  { c:['#9be872','#3f9a1c','#f3ffe0'], g:-40,  arc:0, swirl:true },
};
const FX_HEAL = { c:['#8dff9a','#2fbf52','#ffffff'], plus:true }, FX_BUFF = { c:['#ffd66a','#ff9a1a','#fff6d0'] },
  FX_BAD = { c:['#b06aff','#7a2fd0','#e9d0ff'] }, FX_DEAD = { c:['#3a3733','#1c1a18','#6b665a'], g:-70, dk:true };
const fxOff = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const FX_MAX = 260;   // garde-fou : si l'appareil rame, le dt plafonné (voir fxTick) fait vivre les particules plus longtemps en temps réel,
                       // ce qui en accumule encore plus et ralentit davantage — ce plafond casse cette spirale
let fxcv = null, fxG = null, fxP = [], fxRaf = 0, fxLast = 0, fxInTick = false;
const fxr = (a,b) => a + Math.random()*(b-a);
function fxSize(){
  fxcv = $('#fxcv'); if (!fxcv) return;
  const d = Math.min(2, window.devicePixelRatio || 1);
  fxcv.width = Math.round(field.clientWidth*d); fxcv.height = Math.round(field.clientHeight*d);
  fxG = fxcv.getContext('2d'); fxG.setTransform(d,0,0,d,0,0);
}
// Point d'une unité : at = 0 aux pieds, ~.45 au milieu du corps ; s = échelle des effets d'après la taille du sprite
function fxPt(id, at = .45){
  const n = nodes[id], h = n.querySelector('.token').offsetHeight;
  return { x:parseFloat(n.style.left), y:parseFloat(n.style.top) - h*at - (at ? 0 : 4), s:Math.max(.5, Math.min(1.6, h/100)) };
}
function fxAdd(p){
  if (fxOff || !fxcv) return;
  fxP.push(p);
  if (fxP.length > FX_MAX) fxP.splice(0, fxP.length - FX_MAX);
  // fxInTick : pendant une image, fxRaf vaut 0 alors qu'une image EST en cours. Sans ce garde-fou, les traînées
  // de projectiles et les impacts programmaient chacun une image de plus, qui en programmait deux, etc. — le nombre
  // de boucles par image doublait, et le combat devenait injouable au fil des sorts lancés.
  if (!fxRaf && !fxInTick){ fxLast = performance.now(); fxRaf = requestAnimationFrame(fxTick); }
}
function fxBurst(x, y, E, n, pw, s = 1){
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.283, v = fxr(.3,1)*pw*s;
    fxAdd({ k:'dot', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v*.8, g:(E.g || 0)*s, r:fxr(2,5)*s, c:E.c[i%3], sh:E.sh || (E.sq ? 'sq' : 'dot'), rot:a, dk:E.dk, life:0, max:fxr(.3,.65) });
  }
}
function fxRing(x, y, c, r, max = .45, w = 3){ fxAdd({ k:'ring', x, y, c, r, w, life:0, max }); }
// Colonne de particules : monte (soin, bonus) ou retombe (malus)
function fxRise(id, E, n, dir = -1){
  const p = fxPt(id, dir < 0 ? .1 : .95);
  for (let i = 0; i < n; i++)
    fxAdd({ k:E.plus ? 'plus' : 'dot', x:p.x + fxr(-28,28)*p.s, y:p.y + fxr(-8,8)*p.s, vx:fxr(-8,8), vy:dir*fxr(55,125)*p.s, g:0, r:fxr(2.5,5)*p.s, c:E.c[i%3], life:-i*.035, max:fxr(.5,.85) });
}
function fxTick(now){
  fxRaf = 0;
  if (!fxcv || !fxcv.isConnected){ fxP = []; return; }
  fxInTick = true;
  const dt = Math.min(.05, (now - fxLast)/1000) * speed, g = fxG, cur = fxP; fxLast = now; fxP = [];
  g.clearRect(0, 0, fxcv.width, fxcv.height);
  for (const p of cur){
    p.life += dt;
    if (p.life < 0){ fxP.push(p); continue; }

    allies: state.A.map((u,i) => ({ u, t:tal(u.id), xp: L && L.xp[i] })),
