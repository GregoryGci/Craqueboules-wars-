    // « Suivant » : l'étage d'après, s'il existe et vient d'être ouvert par cette victoire
    next: !dg.finish && win && stages()[nx] && isUnlocked(nx) ? nx : null };
  const o = document.createElement('div'); o.className = 'over'; o.id = 'endover';
  field.classList.remove('quake');   // une secousse en cours anime un transform, ce qui re-piégerait l'overlay fixe dans l'arène
  field.appendChild(o);
  paintEnd();
  log(win ? 'Combat terminé : victoire.' : 'Combat terminé : défaite.', 'sys');
}
const END_HEAD = `<thead><tr><th>Nom</th><th class="c-sec">Niv.</th><th>Dégâts infligés</th><th class="c-sec">Critiques</th>
  <th class="c-sec">Dégâts subis</th><th class="c-sec">Soins</th><th class="c-sec">K.O.</th><th>XP gagnée</th></tr></thead>`;
function endRow(r, top, dg){
  const { u, t, xp } = r;
  return `<tr><td><span class="nmc">${portrait(u.key, 26, { badge:false })}${u.name}</span></td><td class="c-sec">${u.level}</td>
    <td><span class="row" style="flex-wrap:nowrap"><b>${fmt(t.dmg)}</b><span class="xpbar dmgbar"><b style="width:${t.dmg / top * 100}%"></b></span></span></td>
    <td class="c-sec">${t.hits ? `${t.crits}/${t.hits}` : '—'}</td><td class="c-sec">${fmt(t.taken)}</td>
    <td class="c-sec">${t.heal ? `<span class="pos">${fmt(t.heal)}</span>` : '—'}</td><td class="c-sec">${t.kills || '—'}</td>
    <td>${xp ? `<span class="row" style="flex-wrap:nowrap">+${dg.xp}<span class="xpbar"><b style="width:${Math.min(100, dg.xp / xpNeed(u.level) * 100)}%"></b></span>${xp.ups ? `<b class="pos">niv. ${xp.level}</b>` : ''}</span>` : '—'}</td></tr>`;
}
// Un bloc du bilan. Replié (beaucoup de monstres, typiquement les vagues cumulées), il ne montre que le boss
// — ou le plus gros score à défaut — et renvoie le reste derrière une rangée de portraits.
function endBlock(label, rows, top, dg){
  const fold = rows.length > END_KEEP && !endAll;
  const keep = fold ? [rows.find(r => r.u.boss) || rows.slice().sort((a,b) => b.t.dmg - a.t.dmg)[0]] : rows;
  const rest = fold ? rows.filter(r => !keep.includes(r)) : [];
  return `<div class="band"><span>${label}</span>${rows.length > END_KEEP ? `<span style="opacity:.75">${rows.length}</span>` : ''}</div>
    <div class="resscroll"><table class="restab">${END_HEAD}<tbody>${keep.map(r => endRow(r, top, dg)).join('')}</tbody></table></div>
    ${rest.length ? `<button class="morechips" data-act="endAll">
      <span class="stack">${rest.slice(0,8).map(r => portrait(r.u.key, 26, { badge:false, round:true })).join('')}</span>
      <b>+${rest.length}</b><span class="go">Tout voir</span></button>` : ''}`;
}
function paintEnd(){
  const o = $('#endover'); if (!o || !endData) return;
  const { dg, win, custom, L, allies, foes, turns, wave, next } = endData;
  const top = Math.max(1, ...allies.map(r => r.t.dmg), ...foes.map(r => r.t.dmg));
  const loot = dg.finish ? custom : win ? `<div class="band">Butin</div><div class="lootrow">
      <span class="cell" title="Kamas">${kamaIcon(34)}<span class="lv">${fmt(L.kamas)}</span></span>
      ${L.items.map(it => `<span class="cell r-${it.rarity}" title="${itemName(it)} · ${RAR_LABEL[it.rarity]}">${itemIcon(it)}<span class="lv">+0</span></span>`).join('')}
      ${(L.gear || []).map(g => `<span class="cell ${JET_CLASS(g.jet)}" title="${esc(gearName(g))} · niveau ${gearLvl(g)} · jet ${Math.round(g.jet*100)} %">${gearIcon(g, 40)}<span class="lv">${Math.round(g.jet*100)}%</span></span>`).join('')}
      ${L.stones ? `<span class="cell r-heroique" title="Pierre d'âme pleine">${gemIcon('perfect',36)}<span class="q">${L.stones}</span></span>` : ''}
    </div>${L.first ? '<p class="hint" style="padding:0 8px 6px">Premier passage : une pierre d\'âme pleine offerte.</p>' : ''}` : '';
  const btns = dg.finish
    ? `<button class="btn" data-act="nav" data-v="${dg.back}">Retour</button>`
    : `${next != null ? `<button class="btn" data-act="nextStage">Suivant</button>` : ''}
       <button class="btn ${next != null ? 'grey' : ''}" data-act="refight">Recommencer</button>
       <button class="btn grey" data-act="nav" data-v="${win ? 'trophees' : 'equipe'}">${win ? 'Inventaire' : 'Renforcer l\'équipe'}</button>
       <button class="btn grey" data-act="nav" data-v="donjons">Donjons</button>`;
  o.innerHTML = `<div class="win"><div class="wt"><h2>Fin du combat</h2></div><div class="wb" style="display:grid; gap:6px">
    <p style="margin:0">${dg.endLabel || (win ? 'Victoire' : 'Défaite')} · ${dg.name} · ${waveWord(dg).toLowerCase()} ${wave + 1} / ${dg.waves.length} · ${turns} tours</p>
    ${endBlock(win ? 'Gagnants' : 'Perdants', allies, top, dg)}
    ${loot}
    ${endBlock(win ? 'Perdants' : 'Gagnants', foes, top, dg)}
    <div class="row endbtns" style="justify-content:center; margin-top:6px">${btns}</div>
  </div></div>`;
}
async function loop(my){
  syncAll(); await wait(500);
  while (!state.over){
    if (my !== battleId) return;
    if (curStage.turnCap && state.turn >= curStage.turnCap){ state.over = true; showEnd('B'); break; }   // combat à durée limitée
    const actor = Engine.advance(state);
    for (const u of Engine.all(state)) if (u.alive) setAtb(u.id, u.atb, 300);
    await wait(330); if (my !== battleId) return;
    setActive(actor.id); renderOrder(); renderInfo();
    $('#turn').textContent = `Tour ${state.turn + 1}`;
    const start = Engine.beginTurn(state, actor);
    renderSkills(actor, true);
    await play(start.events, my); if (my !== battleId) return;
    if (start.skipped){ setActive(null); continue; }
    let choice;
    if (actor.side === 'B' || auto || curStage.forceAuto){ await wait(curStage.forceAuto ? 120 : 200); choice = Engine.aiChoose(state, actor); }
    else choice = await waitPlayer(actor);
    if (my !== battleId) return;
    hoverSkill = null; renderSkills(actor, true);
    const ev = Engine.act(state, actor, choice.skill, choice.target);
    await play(ev, my); if (my !== battleId) return;
    setActive(null); syncAll();
  }
}

/* =====================================================================
   10. LAUNCHER — reprend l'updater Dofus 2.0. La barre de mise à jour n'est pas décorative :
   elle suit le vrai chargement du catalogue (444 ko plus les images DofusDB) et le couvre,
   au lieu de laisser un écran vide. L'œuf lance le jeu, et ouvre la création au premier démarrage.
   ===================================================================== */
const classOf = () => { const p = save && save.player; if (!p) return null;
  return CLASSES.find(c => c.id === p.cls) || CLASSES.find(c => clsSlug(c) === String(p.cls)) || null; };   // tolère les sauvegardes d'avant les identifiants DofusDB

let lauPct = 0, lauCap = 0, lauCreep = null, lauTab = 'log', lauLog = [], lauReady = false, creName = '', creCls = null, creSex = 'm';
let creStep0 = 'compte', creMail = '', creMsg = '', creBusy = false;   // compte → nom → classe
const lauT0 = Date.now();
const LAU_MIN = 1400;   // on laisse le launcher respirer : un chargement instantané donnerait un flash désagréable

function lauPaintBar(){
  const f = $('#lauFill'), p = $('#lauPct'); if (!f) return;
  f.style.width = lauPct + '%'; p.textContent = Math.round(lauPct) + ' %';
}
function lauTo(cap, txt){
  lauCap = Math.max(lauCap, cap);
  if (txt){ lauLog.push(txt); const t = $('#lauTxt'); if (t) t.textContent = txt; if (lauTab === 'log') lauPan(); }
  if (!lauCreep) lauCreep = setInterval(() => {
    if (lauPct < lauCap){ lauPct = Math.min(lauCap, lauPct + Math.max(.35, (lauCap - lauPct) * .09)); lauPaintBar(); }
    else if (lauCap >= 100 && lauPct >= 100){ clearInterval(lauCreep); lauCreep = null; lauOpen(); }
  }, 55);
}
function lauPan(){
  const el = $('#lauPan'); if (!el) return;
  if (lauTab === 'log'){
    el.innerHTML = `<ul>${lauLog.map(l => `<li><span class="d">›</span><span>${esc(l)}</span></li>`).join('')}</ul>`;
    el.scrollTop = el.scrollHeight; return;
  }
  const n = [];
  if (save && save.player) n.push(`Content de te revoir, ${esc(save.player.name)}.`);
  if (CAT) n.push(`Catalogue du ${esc(CAT.date)} : ${fmt(CAT.monsters.length)} monstres et ${fmt(CAT.dungeons.length)} donjons.`);
  n.push('Les raids lâchent les trophées, les dragons gardent les Dofus.');
  n.push('Nouveau : tous les modes de jeu sont réunis dans l\'écran « Jouer ».');
  n.push('Nouveau : l\'interface s\'adapte au téléphone, en portrait comme en paysage.');
  el.innerHTML = `<ul>${n.map(x => `<li><span class="d">•</span><span>${x}</span></li>`).join('')}</ul>`;
}
// Chargement fini : l'œuf s'active
function lauOpen(){
  if (lauReady) return;
  lauReady = true;
  const e = $('#lauEgg'); if (!e) return;
  e.disabled = false;
  $('#lauPlay').textContent = save && save.player ? 'Jouer' : (me ? 'Créer mon personnage' : 'Commencer');
  $('#lauTxt').textContent = save && save.player ? 'Prêt à jouer.' : 'Prêt — crée ton invocateur.';
  lauPan();
}
// ---- Création : le nom, puis la classe
function creStep(){
  const mid = $('#lauMid'); if (!mid) return;
  $('#lauw').hidden = true; mid.hidden = false;
  if (creStep0 === 'compte'){
    mid.innerHTML = `<div class="cre">
      <div><b style="font-size:15px">Ton compte</b>
        <p style="margin:3px 0 0; font-size:12px; color:#bdb6a6">Il garde ta partie en ligne : tu la retrouves sur n'importe quel appareil, et il te donne accès au chat et à l'arène contre d'autres joueurs.</p></div>
      <div class="fld"><label for="creM">Adresse électronique</label><input id="creM" type="email" autocomplete="email" value="${esc(creMail)}"></div>
      <div class="fld"><label for="creP">Mot de passe</label><input id="creP" type="password" autocomplete="new-password" placeholder="6 caractères minimum"></div>
      ${creMsg ? `<div class="cremsg">${esc(creMsg)}</div>` : ''}
      <div class="row" style="justify-content:space-between">
        <button class="btn grey sm" data-act="creSkip">Jouer sans compte</button>
        <span class="row" style="gap:6px"><button class="btn grey" data-act="creLogin" ${creBusy ? 'disabled' : ''}>J'ai déjà un compte</button>
          <button class="btn" data-act="creAccount" ${creBusy ? 'disabled' : ''}>${creBusy ? 'Un instant…' : 'Créer le compte'}</button></span>
      </div></div>`;
    const p = $('#creP'); if (p) p.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.creAccount(); });
    return;
  }
  if (!creName){
    mid.innerHTML = `<div class="cre" style="grid-column:1/-1">
      <div class="fld"><label for="creN">Le nom de ton invocateur</label>
        <input id="creN" maxlength="18" autocomplete="off" placeholder="Ton nom" value=""></div>
      <p style="margin:0; font-size:12px; color:#bdb6a6">Il sert à ta sauvegarde, gardée dans ce navigateur. Aucun compte en ligne n'est créé.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="creName">Continuer</button></div></div>`;
    const i = $('#creN'); if (i){ i.focus(); i.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.creName(); }); }
    return;
  }
  const sel = creCls || CLASSES[0].id;
  const cur = CLASSES.find(c => c.id === sel) || CLASSES[0];
  mid.innerHTML = `<div class="cre" style="grid-column:1/-1">
    <div class="crehead">
      ${clsAvatar(cur, creSex, 74)}
      <div style="min-width:0">
        <b style="font-size:15px">${cur.n}</b>
        <div style="font-size:11.5px; color:#bdb6a6">${cur.r}</div>
        <div style="font-size:12.5px; color:#ffc87a; margin-top:3px">${cur.b}</div>
      </div>
      <div class="sexseg" role="group" aria-label="Apparence">
        <button data-act="creSex" data-v="m" aria-pressed="${creSex === 'm'}">Mâle</button>
        <button data-act="creSex" data-v="f" aria-pressed="${creSex === 'f'}">Femelle</button>
      </div>
    </div>
    <div class="clsgrid">${CLASSES.map(c => `<button class="clscard" data-act="creCls" data-v="${c.id}" aria-pressed="${sel === c.id}" title="${c.n} · ${c.r}">
      ${clsAvatar(c, creSex, 46)}<b>${c.n}</b><span class="tag">${c.g}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><button class="btn grey sm" data-act="creBack">‹ Retour</button>
      <button class="btn" data-act="creGo">Entrer dans le monde</button></div></div>`;
}
function lauStart(){
  $('#lau').hidden = true;
  $('#wrap').hidden = false;
  render(); window.scrollTo(0,0);
}

Object.assign(ACT, {
  lauTab(d){ lauTab = d.v; $('#lauTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === lauTab))); lauPan(); },
  lauCog(){ toast('Les réglages sont dans le bas de page, une fois le jeu lancé.'); },
  launch(){
    if (!lauReady) return;
    if (save && save.player) return lauStart();
    creName = ''; creCls = null; creSex = 'm'; creMsg = '';
    creStep0 = sb ? (me ? 'nom' : 'compte') : 'nom';   // sans dos en ligne, on saute l'étape du compte
    creStep();
  },
  async creAccount(){
    const mail = ($('#creM').value || '').trim(), pass = $('#creP').value || '';
    if (!mail || !pass) { creMsg = 'Remplis les deux champs.'; return creStep(); }
    creMail = mail; creBusy = true; creMsg = ''; creStep();
    const r = await netSignUp(mail, pass);
    creBusy = false;
    if (r.err){ creMsg = r.err; return creStep(); }
    if (r.confirm){ creMsg = 'Compte créé. Confirme ton adresse par courriel, puis reviens te connecter.'; return creStep(); }
    creStep0 = 'nom'; creStep();
  },
  async creLogin(){
    const mail = ($('#creM').value || '').trim(), pass = $('#creP').value || '';
    if (!mail || !pass) { creMsg = 'Remplis les deux champs.'; return creStep(); }
    creMail = mail; creBusy = true; creMsg = ''; creStep();
    const r = await netSignIn(mail, pass);
    creBusy = false;
    if (r.err){ creMsg = r.err; return creStep(); }
    const remote = await netPull();                       // une partie existe déjà en ligne ?
    if (remote && remote.data && remote.data.player){
      save = remote.data; persist(); return lauStart();
    }
    creStep0 = 'nom'; creStep();
  },
  creSkip(){ creStep0 = 'nom'; creMsg = ''; creStep(); },
  creName(){
    const v = ($('#creN').value || '').trim().slice(0, 18);
    if (!v) return toast('Choisis un nom.');
    creName = v; creStep();
  },
  creCls(d){ creCls = +d.v; creStep(); },
  creSex(d){ creSex = d.v; creStep(); },
  creBack(){ if (creName) { creName = ''; return creStep(); } if (sb && !me) creStep0 = 'compte'; creStep(); },
  creGo(){
    save.player = { name: creName, cls: creCls || CLASSES[0].id, sex: creSex, born: Date.now() };
    persist(); lauStart();
    toast(`Bienvenue, ${save.player.name} — ${(classOf() || {}).n}.`);
  },
});

// ---- Démarrage : le vrai chargement, raconté par la barre
netInit();
lauTo(8, NET.url ? 'Démarrage du client…' : 'Démarrage du client (mode local)…');
lauPan();
setTimeout(() => lauTo(20, 'Connexion au catalogue DofusDB…'), 160);
fetch('catalogue.json', { cache:'no-cache' })
  .then(r => { lauTo(46, r.ok ? 'Téléchargement du catalogue…' : 'Catalogue distant indisponible, passage en local.'); return r.ok ? r.json() : null; })
  .then(cat => {
    lauTo(66, 'Lecture des données…');
    if (cat && Array.isArray(cat.monsters) && cat.monsters.length){
      buildCatalog(cat);
      lauTo(84, `Bestiaire : ${fmt(cat.monsters.length)} monstres, ${fmt(cat.dungeons.length)} donjons.`);
    } else lauTo(84, 'Bestiaire local chargé.');
  })
  .catch(() => lauTo(84, 'Catalogue injoignable : le jeu démarre avec son bestiaire de secours.'))
  .finally(() => {
    lauTo(92, 'Préparation des donjons…');
    finalizeStages();
    save = loadSave();
    if (TEST){
      save.kamas = Math.max(save.kamas, 1e6); save.stones = Math.max(save.stones, 1000); save.gold = Math.max(save.gold, 500); save.scrolls = Math.max(save.scrolls, 50);
      for (const el in save.ess) save.ess[el] = Math.max(save.ess[el], 999);
    }
    persist();
    lauPan();
    (async () => {
      if (sb){
        lauTo(96, 'Connexion au serveur…');
        await netResume();
        if (me){
          const remote = await netPull();
          const localAt = (save && save.at) || 0, remoteAt = remote ? Date.parse(remote.updated_at) || 0 : 0;
          if (remote && remote.data && remoteAt > localAt){     // la partie en ligne est plus récente : elle gagne
            save = remote.data;
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){}
            lauTo(98, 'Partie récupérée depuis ton compte.');
          } else lauTo(98, 'Compte connecté.');
        } else lauTo(98, 'Prêt à créer un compte.');
      }
      lauPan();
      setTimeout(() => lauTo(100, 'Prêt.'), Math.max(0, LAU_MIN - (Date.now() - lauT0)));
    })();
  });
})();
</script>
