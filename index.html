<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>Invocateurs des Douze</title>
<style>
/* Layout : reprend l'interface Dofus 2.0 (captures fournies). Fond brun du lanceur, fenêtres gris-beige à barre de titre
   sombre et bouton fermer orange, cases d'inventaire arrondies, bandeaux de section sombres, lignes alternées, boutons orange.
   Thème unique assumé. */
:root{
  color-scheme: light;
  --bg:#4a4137; --bg2:#625649;
  --win:#d5d1bd; --win-hi:#f2efe3; --win-out:#6a655a;
  --panel:#e5e2d1; --panel-line:#b6b09a;
  --row:#dcd9c6; --row2:#e8e5d6;
  --slot:#cdc8b3; --slot-hi:#dedad0; --slot-line:#a9a38c;
  --bar:#55544f; --bar2:#3a3936; --bar-ink:#fff;
  --band:#5d6b74; --band2:#4b5860;
  --ink:#2e2b24; --ink2:#6b6657;
  --orange:#ff9a2e; --orange2:#ef7500; --orange-dk:#b85700;
  --good:#3b8a17; --bad:#c23b22;
  --ally:#2b7bd6; --foe:#d8402b;
  --hp:#d23b2b; --hp2:#ff6a4d; --atb:#ff9a2e;
  --el-terre:#9a622a; --el-feu:#d9481f; --el-eau:#2f7bc8; --el-air:#4c9b33;
  --r-normal:#77705f; --r-magique:#3b8a17; --r-rare:#2a69b8; --r-heroique:#8a44c4; --r-legendaire:#d97100;
  --font: Tahoma, Verdana, 'Segoe UI', Geneva, sans-serif;
  --tok:62px;
}
html,body{min-height:100%}
body{background:var(--bg); background-image:radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 65%); color:var(--ink); font-family:var(--font); font-size:13px; line-height:1.4}
.wrap{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:12px 28px; display:grid; gap:10px}
button, select, input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--orange); outline-offset:1px}
h1,h2,h3{font-family:var(--font); margin:0; line-height:1.15; text-wrap:balance}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:#cfcab6; border-radius:5px}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg, var(--orange), var(--orange2)); border-radius:5px; border:1px solid var(--orange-dk)}
*{scrollbar-color:var(--orange2) #cfcab6}

/* ---------- Fenêtre Dofus ---------- */
.win{position:relative; background:var(--win); border:1px solid var(--win-out); border-radius:9px; box-shadow:inset 0 0 0 3px var(--win-hi), 0 4px 14px #0006; min-width:0; overflow:hidden}
.wt{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; min-height:32px; padding:5px 40px; margin:3px 3px 0; border-radius:7px 7px 0 0;
  background:linear-gradient(#64635d, var(--bar) 45%, var(--bar2)); color:var(--bar-ink); box-shadow:inset 0 1px 0 #ffffff30}
.wt h2{font-size:16px; font-weight:normal; letter-spacing:.01em; text-shadow:0 1px 0 #000}
.wt h2 small, .wt small{font-size:11px; color:#d6d2c4; margin-left:6px}
.wt .side{position:absolute; right:38px; top:50%; transform:translateY(-50%); display:flex; gap:6px; align-items:center}
.wt .lft{position:absolute; left:10px; top:50%; transform:translateY(-50%); display:flex; gap:6px; align-items:center; font-size:11px; color:#d6d2c4}
.x{position:absolute; right:7px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:5px; border:1px solid var(--orange-dk); background:linear-gradient(var(--orange), var(--orange2)); color:#fff; font-weight:bold; font-size:13px; line-height:1; display:grid; place-items:center; cursor:pointer; box-shadow:inset 0 1px 0 #ffd19a}
.wb{padding:10px}
.panel{background:var(--panel); border:1px solid var(--panel-line); border-radius:7px; box-shadow:inset 0 1px 0 #fff8}
.band{background:linear-gradient(#5f5e58, #44433f); color:#fff; padding:4px 10px; border-radius:4px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.band.slate{background:linear-gradient(var(--band), var(--band2))}
.rows{list-style:none; margin:0; padding:0; display:grid}
.rows li{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 8px; background:var(--row)}
.rows li:nth-child(even){background:var(--row2)}
.rows li .lb{display:flex; align-items:center; gap:7px}
.rows li b{font-variant-numeric:tabular-nums}
.rows li em{font-style:normal; color:var(--good)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.muted{color:var(--ink2)}
.hint{color:var(--ink2); font-size:12px; margin:0; min-height:1.4em}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.stars{color:#ff9a2e; letter-spacing:-1px; text-shadow:0 1px 0 #6b3a06}

.btn{background:linear-gradient(var(--orange), var(--orange2)); border:1px solid var(--orange-dk); border-radius:5px; padding:4px 14px; cursor:pointer; font-weight:bold; color:#fff; text-shadow:0 1px 0 #8a4100; box-shadow:inset 0 1px 0 #ffd19a, 0 1px 2px #0004; min-height:26px}
.btn:hover:not(:disabled){background:linear-gradient(#ffb04f, #ff8410)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{filter:grayscale(1); opacity:.55; cursor:not-allowed}
.btn.grey{background:linear-gradient(#8a8578, #6b665a); border-color:#4f4b42; text-shadow:0 1px 0 #333; box-shadow:inset 0 1px 0 #ffffff40, 0 1px 2px #0004}
.btn.grey:hover:not(:disabled){background:linear-gradient(#9b9588, #777164)}
.btn.sm{padding:2px 9px; min-height:22px; font-size:12px}
.btn[aria-pressed="true"].grey{background:linear-gradient(var(--orange), var(--orange2)); border-color:var(--orange-dk)}
.sel{appearance:none; background:#fff linear-gradient(var(--orange), var(--orange2)) no-repeat right / 22px 100%; border:1px solid var(--slot-line); border-radius:4px; padding:3px 28px 3px 7px; min-height:24px; cursor:pointer; box-shadow:inset 0 1px 2px #0002}
.selwrap{position:relative; display:inline-block}
.selwrap::after{content:''; position:absolute; right:7px; top:50%; margin-top:-2px; border:4px solid transparent; border-top:5px solid #fff; pointer-events:none}

/* ---------- En-tête ---------- */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px}
.res{display:flex; flex-wrap:wrap; list-style:none; margin:0; padding:3px 4px; background:var(--panel); border:1px solid var(--win-out); border-radius:8px; box-shadow:inset 0 0 0 2px var(--win-hi)}
.res li{display:flex; align-items:center; gap:5px; padding:2px 9px 2px 6px; font-variant-numeric:tabular-nums; font-weight:bold}
.res li + li{border-left:1px solid var(--panel-line)}
.res svg{display:block; flex:none}
.tabs{display:flex; flex-wrap:wrap; gap:3px}
.tabs button{background:linear-gradient(#cfcab7, #b7b19c); border:1px solid var(--win-out); border-radius:8px 8px 0 0; padding:6px 16px; cursor:pointer; font-weight:bold; color:#4a463c; box-shadow:inset 0 1px 0 #fff8}
.tabs button[aria-current="page"]{background:linear-gradient(var(--orange), var(--orange2)); color:#fff; border-color:var(--orange-dk); text-shadow:0 1px 0 #8a4100}
.tabs button:hover:not([aria-current]){background:linear-gradient(#ddd8c6, #c4bea9)}
body.in-combat .tabs{display:none}

/* ---------- Portraits & cases ---------- */
.por{--sz:44px; position:relative; flex:none; width:var(--sz); height:var(--sz); border-radius:7px; display:inline-grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--elc) 38%, #fff) 0, var(--elc) 70%, color-mix(in srgb, var(--elc) 55%, #000) 100%);
  border:1px solid #00000055; font-weight:bold; font-size:calc(var(--sz) * .34); color:#fff; text-shadow:0 1px 0 #000a}
.por.round{border-radius:50%}
.por .pimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:5%; box-sizing:border-box; background:radial-gradient(circle at 50% 40%, #f6f3e8, #d6d1be 78%); z-index:1}
.por.round .pimg{border-radius:50%}
.por .elb{z-index:2}
.elb{position:absolute; right:1px; bottom:1px; width:clamp(12px, calc(var(--sz) * .3), 20px); aspect-ratio:1; border-radius:50%; background:var(--elc); border:1px solid #fff; display:grid; place-items:center; box-shadow:0 0 0 1px #0006}
.elb svg{width:70%; height:70%}
.cell{position:relative; width:52px; height:52px; display:grid; place-items:center; padding:0; cursor:pointer; flex:none;
  background:linear-gradient(var(--slot-hi), var(--slot)); border:1px solid var(--slot-line); border-radius:8px; box-shadow:inset 0 1px 0 #fff9, inset 0 -2px 4px #0001}
.cell:hover{border-color:var(--orange2)}
.cell.on{border:2px solid var(--orange2); box-shadow:0 0 0 1px #fff, inset 0 0 6px #ff9a2e66}
.cell svg, .cell img{width:42px; height:42px; object-fit:contain}
.cell .iimg{position:absolute; inset:4px; width:calc(100% - 8px); height:calc(100% - 8px); object-fit:contain; background:linear-gradient(var(--slot-hi), var(--slot)); border-radius:6px; z-index:1}
.cell .q, .cell .lv, .cell .own, .cell .team, .cell .st{z-index:2}
.cell .q{position:absolute; left:0; top:0; min-width:16px; padding:0 3px; border-radius:7px 0 5px 0; background:#5a5953; color:#fff; font-size:10px; font-weight:bold; line-height:15px; text-align:center}
.cell .lv{position:absolute; right:2px; bottom:0; font-size:10px; font-weight:bold; color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000}
.cell .own{position:absolute; right:3px; top:3px; width:7px; height:7px; border-radius:50%; background:var(--ally); box-shadow:0 0 0 1px #fff}
.cell .ghost{opacity:.28; filter:grayscale(1)}
.cell.r-magique{border-color:#3b8a17aa} .cell.r-rare{border-color:#2a69b8bb} .cell.r-heroique{border-color:#8a44c4cc}
.cell.r-legendaire{border-color:var(--r-legendaire); box-shadow:inset 0 0 8px #ff9a2e55, inset 0 1px 0 #fff9}
.cell.on[class*="r-"]{border:2px solid var(--orange2)}
.grid{display:grid; grid-template-columns:repeat(auto-fill, 52px); gap:6px; justify-content:start}

/* ---------- Donjons ---------- */
.teamstrip{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.teamstrip ul{display:flex; flex-wrap:wrap; gap:14px; list-style:none; margin:0; padding:0}
.teamstrip li{display:flex; align-items:center; gap:8px}
.teamstrip li b{display:block}
.dgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap:12px}
.dcard{display:flex; flex-direction:column}
.mini{display:block; width:100%; height:92px; border-radius:6px; border:1px solid var(--panel-line)}
.dcard .wb{display:grid; gap:8px; flex:1}
.dcard p{margin:0; color:var(--ink2)}
.foes{display:flex; flex-wrap:wrap; gap:6px 12px; list-style:none; margin:0; padding:0}
.foes li{display:flex; align-items:center; gap:6px}
.bossb{font-size:9px; background:var(--foe); color:#fff; padding:1px 5px; border-radius:3px; text-transform:uppercase; font-weight:bold}
.droplist li{font-size:12px} .droplist li > span:first-child{display:inline-flex; align-items:center; gap:4px}
.dchips{display:flex; flex-wrap:wrap; gap:2px 8px; justify-content:flex-end; font-size:11px}
.dicos{display:flex; align-items:center; gap:2px} .dicos img{width:24px; height:24px; object-fit:contain}
.drops{display:grid; gap:3px; font-size:11px; color:var(--ink2)}
.dropbar{display:flex; height:8px; border-radius:4px; overflow:hidden; border:1px solid var(--slot-line); background:var(--slot)}
.dropbar span{background:var(--rc)}
.dcard footer{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-top:auto}
.ok{color:var(--good); font-weight:bold}
.new{color:var(--orange-dk); font-weight:bold}
.dcard.locked .mini, .dcard.locked .foes{filter:grayscale(1); opacity:.5}

.dsplit{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.dlist{max-height:540px; overflow:auto; display:grid; gap:2px; padding:4px; align-content:start}
.drow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; text-align:left; background:var(--row); border:1px solid transparent; border-radius:5px; padding:3px 8px 3px 3px; cursor:pointer}
.drow:nth-child(even){background:var(--row2)}
.drow:hover{border-color:var(--panel-line)}
.drow.on{border-color:var(--orange2); background:#fbe3bf}
.drow.locked{opacity:.55}
.dgrp{display:grid; gap:2px}
.dgrp:nth-child(even) > .ghead{background:var(--row2)}
.ghead.cur{border-color:var(--panel-line); box-shadow:inset 3px 0 0 var(--orange2)}
.ghead .chev{display:inline-block; width:12px; text-align:center; color:var(--ink2)}
.glv{display:grid; gap:2px; margin:0 0 4px 20px; padding-left:6px; border-left:2px solid var(--panel-line)}
.drow.sub{padding:3px 8px}
.lvn{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#77756e, #55544f); color:#fff; font-weight:bold; font-size:11px}
.drow.sub.on .lvn{background:linear-gradient(var(--orange), var(--orange2))}
.sklv{font-weight:normal; font-size:11px; color:var(--orange-dk); white-space:nowrap}
.skup{grid-column:2; display:flex; flex-wrap:wrap; gap:4px; margin-top:3px}
.skup .btn{display:inline-flex; align-items:center; gap:4px}
.drow .dn{display:grid; min-width:0}
.drow .dn b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.drow .dst{font-size:11px}
.search{width:100%; border:1px solid var(--slot-line); border-radius:4px; padding:5px 8px; background:#fff; box-shadow:inset 0 1px 2px #0002; box-sizing:border-box}
.mini.big{height:150px}
.loading{padding:40px; text-align:center; color:#e8dfca}

/* ---------- Fiche monstre ---------- */
.split{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:12px; align-items:start}
.fhead{display:flex; gap:10px; align-items:center}
.fhead h3{font-size:17px}
.seg-bar{display:flex; gap:2px; width:100%; margin-top:3px}
.seg-bar i{flex:1; height:8px; background:#3d3c38; border-radius:2px; box-shadow:inset 0 1px 1px #000a}
.seg-bar i.on{background:linear-gradient(#9c9a92, #6f6d66)}
.seg-bar.red i.on{background:linear-gradient(#ff6a4d, #c0281a)}
.doll{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; padding:10px; position:relative}
.dcol{display:grid; gap:8px}
.dcenter{position:relative; display:grid; place-items:center; min-height:200px; border-radius:8px; border:1px solid var(--panel-line);
  background:radial-gradient(circle at 50% 55%, #e9e6d8 0 28%, #dcd8c6 29% 30%, #e3dfcf 31% 46%, #d6d2bf 47% 48%, #dedacb 49%)}
.dcenter .por{--sz:120px; background:none; border:0; box-shadow:none}
.dcenter .por:not(.img){background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--elc) 38%, #fff) 0, var(--elc) 70%, color-mix(in srgb, var(--elc) 55%, #000) 100%); border-radius:50%; --sz:100px}
.dcenter .por:has(.pimg){--sz:150px; background:none; border:0; border-radius:0}
.dcenter .por .pimg{background:none; padding:0}
.dcenter .ring{position:absolute; bottom:22px; width:96px; height:22px; border-radius:50%; border:3px solid var(--ally); background:#2b7bd633; z-index:0}
.dcenter .por{z-index:1}
/* Page d'équipement façon Dofus 2 : la colonne des Dofus et trophées à gauche, deux colonnes
   d'emplacements autour du monstre, le détail de l'objet en dessous. */
.inv2{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:7px; align-items:start; padding:9px; position:relative}
.ecol{display:grid; gap:6px; align-content:start}
.ecol.dof{gap:4px; padding-right:4px; border-right:1px solid var(--panel-line)}
.inv2 .dcenter{min-height:224px}
.ecell{position:relative; width:52px; height:52px; display:grid; place-items:center; padding:0; cursor:pointer; flex:none;
  background:linear-gradient(var(--slot-hi), var(--slot)); border:1px solid var(--slot-line); border-radius:8px;
  box-shadow:inset 0 1px 0 #fff9, inset 0 -2px 4px #0001}
.ecell img{width:42px; height:42px; object-fit:contain}
.ecell.on{border:2px solid var(--orange2); box-shadow:0 0 0 1px #fff, inset 0 0 6px #ff9a2e66}
.ecell .sl{position:absolute; left:0; bottom:0; font-size:8px; letter-spacing:.04em; text-transform:uppercase; color:#6b6657;
  background:#ffffffc4; border-radius:0 5px 0 6px; padding:0 3px; line-height:11px}
.ecell .jt{position:absolute; right:2px; top:1px; font-size:9px; font-weight:bold; color:#fff; text-shadow:0 0 2px #000, 0 0 2px #000}
.ecell.empty{opacity:.55} .ecell.empty .gh{font-size:9px; color:#6b6657; text-align:center; line-height:1.1; padding:0 2px}
/* détail d'un objet, comme le cartouche bleu du jeu */
.gdet{margin-top:8px; border:1px solid var(--panel-line); border-radius:8px; overflow:hidden; background:var(--panel)}
.gdhead{display:flex; align-items:baseline; gap:8px; padding:5px 10px; background:linear-gradient(#4f6f9a, #3b5679); color:#fff}
.gdhead b{font-size:13.5px} .gdhead .lv{margin-left:auto; font-size:12px; opacity:.9}
.gdbody{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; padding:10px}
.gdicon{width:78px; display:grid; gap:5px; justify-items:center}
.gdicon .box{width:78px; height:78px; display:grid; place-items:center; border:1px solid var(--slot-line); border-radius:8px;
  background:linear-gradient(var(--slot-hi), var(--slot))}
.gdicon .box img{width:64px; height:64px; object-fit:contain}
.gdjet{width:100%; font-size:11px; text-align:center; font-weight:bold}
.gdlines{list-style:none; margin:0; padding:0; border:1px solid var(--panel-line); border-radius:6px; overflow:hidden}
.gdlines li{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:3px 9px; background:var(--row); font-size:12.5px}
.gdlines li:nth-child(even){background:var(--row2)}
.gdlines li.neg{color:var(--bad)} .gdlines li.pos{color:var(--good)}
.gdlines .rg{font-size:11px; color:var(--ink2); font-variant-numeric:tabular-nums}
.gdlines .mini{width:46px; height:6px; border-radius:3px; background:#c6c0ac; overflow:hidden; box-shadow:inset 0 1px 2px #0003}
.gdlines .mini i{display:block; height:100%; background:linear-gradient(#ffd27a, var(--orange2))}
.gdfoot{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:0 10px 10px}
.gdfoot .muted{margin-right:auto}
.glist{display:grid; gap:5px; max-height:270px; overflow:auto; padding:2px}
.grow{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:center; text-align:left; padding:4px 8px 4px 4px;
  background:var(--row2); border:1px solid var(--panel-line); border-radius:6px; cursor:pointer; font:inherit; color:var(--ink)}
.grow:hover{border-color:var(--orange2)}
.grow .box{width:40px; height:40px; display:grid; place-items:center; border-radius:6px; border:1px solid var(--slot-line); background:linear-gradient(var(--slot-hi), var(--slot))}
.grow .box img{width:34px; height:34px; object-fit:contain}
.grow b{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grow .sub{font-size:11px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grow .q{font-size:11px; font-weight:bold; white-space:nowrap}
@media (max-width:620px){
  /* En portrait : le monstre en haut sur toute la largeur, puis les emplacements en rangées sous lui.
     Empiler quatre colonnes donnait une page de 300 px de haut et des cases écrasées. */
  .inv2{grid-template-columns:minmax(0,1fr); gap:7px; padding:7px}
  .inv2 .dcenter{order:-1; min-height:168px}
  .inv2 .ecol{grid-auto-flow:column; justify-content:center; gap:5px}
  .inv2 .ecol.dof{border-right:0; padding-right:0; border-top:1px solid var(--panel-line); padding-top:7px; order:3}
  .ecell{width:clamp(42px, 11.5vw, 52px); height:clamp(42px, 11.5vw, 52px)}
  .ecell img{width:82%; height:82%}
  .ecell .sl{font-size:7.5px; line-height:10px}
  .gdbody{grid-template-columns:minmax(0,1fr); gap:8px}
  .gdicon{width:auto; grid-auto-flow:column; justify-items:start; align-items:center; gap:9px}
  .glist{max-height:46vh}
}
.picker{margin-top:8px; padding:8px; display:grid; gap:6px}
.prow{display:grid; grid-template-columns:auto minmax(0,1fr); gap:0 10px; align-items:center; text-align:left; background:var(--row2); border:1px solid var(--panel-line); border-radius:6px; padding:3px 8px 3px 3px; cursor:pointer}
.prow:hover{border-color:var(--orange2)}
.prow .cell{grid-row:span 2; width:42px; height:42px; cursor:pointer} .prow .cell svg, .prow .cell img{width:34px; height:34px}
.prow b{color:var(--rc); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.prow span{color:var(--ink2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sico{width:14px; height:14px; flex:none}
.sklist{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.sklist li{display:grid; grid-template-columns:38px 1fr; gap:0 8px; align-items:center; padding:4px 6px; background:var(--row)}
.sklist li:nth-child(even){background:var(--row2)}
.sklist .spi{grid-row:span 2; width:36px; height:36px}
.sklist span{color:var(--ink2); font-size:12px}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill, 60px); gap:6px}
.mgrid .cell{width:60px; height:60px}
.mgrid .cell .por{--sz:52px; border:0}
.mgrid .cell .team{position:absolute; right:-1px; top:-1px; width:14px; height:14px; border-radius:0 7px 0 6px; background:var(--ally); color:#fff; font-size:9px; display:grid; place-items:center; font-weight:bold}
.mgrid .cell .st{position:absolute; left:3px; bottom:0; font-size:9px; color:#ffcf6a; text-shadow:0 0 2px #000, 0 0 2px #000; letter-spacing:-1px}

/* ---------- Inventaire / objet ---------- */
.itemhead{display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; padding:10px}
.bigslot{width:96px; height:96px; cursor:default} .bigslot svg, .bigslot img{width:80px; height:80px}
.ftabs{display:flex; gap:3px; padding-inline:6px}
.ftabs span{background:linear-gradient(#cdc8b4, #b9b39e); border:1px solid var(--panel-line); border-bottom:0; border-radius:7px 7px 0 0; padding:3px 14px; color:#4a463c}
.ftabs span.on{background:var(--panel); color:var(--ink)}
.effects{list-style:none; margin:0; padding:0}
.effects li{padding:3px 10px; background:var(--row)}
.effects li:nth-child(even){background:var(--row2)}
.effects li.pos{color:var(--good)}
.effects li{position:relative}
.effects li.subnew{animation:subNew .7s cubic-bezier(.2,1.4,.4,1)}
.effects li.subproc{animation:subProc .6s ease-out}
.effects .procv{position:absolute; right:10px; top:50%; translate:0 -50%; color:var(--orange-dk); font-size:11px; animation:procV 1.6s ease-out forwards}
@keyframes subNew{0%{opacity:0; transform:translateX(-18px); background:#ffe08a; box-shadow:0 0 0 2px var(--orange2)} 60%{opacity:1; transform:none; background:#ffe08a; box-shadow:0 0 12px 2px var(--orange)} 100%{box-shadow:none}}
@keyframes subProc{0%{background:#c9f0a8} 30%{transform:scale(1.04); background:#c9f0a8; box-shadow:0 0 10px 1px var(--good)} 100%{transform:none; box-shadow:none}}
@keyframes procV{0%{opacity:0; transform:translateY(6px) scale(.7)} 15%{opacity:1; transform:scale(1.2)} 70%{opacity:1; transform:none} 100%{opacity:0; transform:translateY(-6px)}}

/* Amélioration d'un trophée. Réussite et échec se ressemblaient : seul le texte changeait.
   Réussite : l'objet encaisse et un éclat le balaie. Échec : une secousse sèche, sans fioriture. */
.bigslot{overflow:hidden}
.itemhead.up-ok .bigslot{animation:upPop .5s cubic-bezier(.2,1.6,.4,1); border-color:var(--orange2)}
.itemhead.up-ok .bigslot::after{content:""; position:absolute; inset:-30% -60%; z-index:3; pointer-events:none;
  background:linear-gradient(104deg, transparent 40%, #ffffffcc 50%, transparent 60%); animation:upSweep .8s ease-out .08s both}
.itemhead.up-ok .lvjump{animation:lvJump .7s cubic-bezier(.2,1.6,.4,1)}
.itemhead.up-ko .bigslot{animation:upShake .45s ease-out}
.itemhead.up-ko .lvjump{opacity:.55}
@keyframes upPop{0%{transform:scale(1)} 34%{transform:scale(1.12)} 100%{transform:scale(1)}}
@keyframes upSweep{0%{transform:translateX(-85%) rotate(0deg); opacity:0} 12%{opacity:1} 100%{transform:translateX(85%); opacity:0}}
@keyframes upShake{0%,100%{transform:translateX(0)} 18%{transform:translateX(-6px)} 36%{transform:translateX(5px)} 56%{transform:translateX(-3px)} 78%{transform:translateX(2px)}}
@keyframes lvJump{0%{transform:scale(1)} 40%{transform:scale(1.5); color:var(--orange2)} 100%{transform:scale(1)}}
.upmsg{transition:none}
.upmsg.ok, .upmsg.ko{animation:msgIn .3s ease-out}
@keyframes msgIn{0%{opacity:0; transform:translateY(-4px)} 100%{opacity:1; transform:none}}
.effects li.empty{color:var(--ink2); font-style:italic}
.invfoot{display:flex; justify-content:flex-end; align-items:center; gap:6px; font-weight:bold; padding:6px 10px 0}
.upmsg{min-height:1.4em; font-weight:bold}
.upmsg.ok{color:var(--good)} .upmsg.ko{color:var(--bad)}

/* ---------- Invocation ---------- */
.altars{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:12px}
.altar .wb{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:center}
.altar .gem{grid-row:span 3}
.altar .count{font-size:34px; font-weight:bold; line-height:1; font-variant-numeric:tabular-nums}
.rates{display:flex; flex-wrap:wrap; gap:4px; list-style:none; margin:0; padding:0; font-size:11px}
.rates li{background:var(--row2); border:1px solid var(--panel-line); padding:1px 7px; border-radius:9px; font-variant-numeric:tabular-nums}
.gemw{position:relative; display:inline-block; flex:none; line-height:0; vertical-align:middle}
.gemw img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.gemw:has(img) svg{visibility:hidden}

/* Invocation : plein écran. --c = couleur du palier d'étoiles atteint pendant la montée */
.sumov{--c:#c9c4b2; position:fixed; inset:0; z-index:9000; display:grid; place-items:center; overflow:hidden; cursor:pointer; color:#fff; text-align:center;
  background:radial-gradient(circle at 50% 46%, color-mix(in srgb, var(--c) 38%, #1a1208) 0, #0b0703 68%); animation:sumIn .25s ease-out}
.sumov.out{opacity:0; transition:opacity .25s}
.sumrays{position:absolute; left:50%; top:46%; width:220vmax; height:220vmax; margin:-110vmax; opacity:0; transition:opacity .35s; animation:sumSpin 16s linear infinite;
  background:repeating-conic-gradient(color-mix(in srgb, var(--c) 60%, transparent) 0 7deg, transparent 7deg 20deg);
  -webkit-mask:radial-gradient(circle, #000 0, transparent 32%); mask:radial-gradient(circle, #000 0, transparent 32%)}
.sumov.burst .sumrays{opacity:.95}
.sumflash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.sumov.burst .sumflash{animation:sumFlash .7s ease-out}
.sumstage{position:relative; display:grid; justify-items:center; gap:6px; padding:16px; max-width:100%}
.sumstone{filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 38px var(--c)); animation:sumShake .5s ease-in-out infinite}
.sumov.tense .sumstone{animation-duration:.11s}
.sumov.burst .sumstone{animation:sumPop .3s ease-in forwards}
.sumstone .gemw, .sumstone svg{width:min(150px, 38vw) !important; height:min(150px, 38vw) !important}
.sumring{position:absolute; left:50%; top:46%; width:120px; height:120px; margin:-60px; border-radius:50%; border:5px solid var(--c); pointer-events:none; animation:sumRing .6s ease-out forwards}
.summote{position:absolute; left:50%; top:46%; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--c); box-shadow:0 0 10px 3px var(--c); pointer-events:none;
  animation:sumMote var(--d,.9s) ease-in var(--dl,0s) infinite backwards}
.sumov.burst .summote{display:none}
.sumres{display:grid; justify-items:center; gap:4px}
.sumres[hidden]{display:none}
.sumres .por{--sz:min(230px, 56vw); background:none; border:0; box-shadow:none; animation:sumMon .75s cubic-bezier(.2,1.5,.4,1) both; filter:drop-shadow(0 0 22px var(--c))}
.sumres .por:not(:has(.pimg)){--sz:150px; border-radius:50%; background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--elc) 38%, #fff) 0, var(--elc) 70%, color-mix(in srgb, var(--elc) 55%, #000) 100%); font-size:44px}
.sumres .por .pimg{background:none; padding:0}
.sumstars[hidden]{display:none}
.sumgrid{display:grid; grid-template-columns:repeat(5, minmax(0, 96px)); gap:8px; justify-content:center; max-width:100%}
.sumcard{position:relative; display:grid; justify-items:center; gap:1px; padding:6px 4px 5px; border-radius:9px; border:2px solid var(--c); min-width:0;
  background:linear-gradient(color-mix(in srgb, var(--c) 30%, #1a1208), #120c06); box-shadow:0 0 12px -2px var(--c); animation:sumCard .35s cubic-bezier(.2,1.6,.4,1) both}
.sumcard.hot{box-shadow:0 0 22px 2px var(--c); animation:sumCard .35s cubic-bezier(.2,1.6,.4,1) both, sumGlow 1.1s ease-in-out .35s infinite}
.sumcard .por{--sz:70px; animation:none; filter:none}
.sumcard .por:not(:has(.pimg)){--sz:56px; font-size:18px}
.sumcard b{color:#ffc531; font-size:11px; letter-spacing:-1px; text-shadow:0 1px 0 #000}
.sumcard small{font-size:10px; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sumcard i{position:absolute; top:-7px; right:-5px; padding:0 5px; border-radius:8px; background:var(--orange2); font-size:9px; font-style:normal; font-weight:bold; line-height:14px}
@keyframes sumCard{from{transform:scale(.2) translateY(-40px); opacity:0}}
@keyframes sumGlow{50%{box-shadow:0 0 34px 8px var(--c)}}
@media (max-width: 560px){ .sumgrid{gap:5px} .sumcard .por{--sz:52px} }
.sumstars{display:flex; gap:4px; min-height:40px; align-items:center}
.sumstars span{font-size:36px; line-height:1; color:#ffc531; text-shadow:0 0 12px #ffb21a, 0 2px 0 #7a4a00; animation:sumStar .4s cubic-bezier(.2,1.8,.4,1) both}
.sumres h3{margin:0; font-size:clamp(24px, 6vw, 38px); color:#fff; text-shadow:0 0 18px var(--c), 0 2px 0 #000; animation:sumUp .4s ease-out both}
.sumres p{margin:0; font-size:14px; color:#e8e2d0; animation:sumUp .4s ease-out .1s both}
.sumnew{display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; background:var(--orange2); color:#fff; font-weight:bold; animation:sumPulse .7s ease-in-out infinite}
.sumbtns{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; animation:sumUp .4s ease-out .2s both}
.sumbtns[hidden]{display:none}
.sumhint{position:absolute; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); left:0; right:0; margin:0; font-size:11px; color:#fff8}
.sumconf{position:absolute; left:50%; top:46%; width:9px; height:14px; margin:-7px -4px; pointer-events:none; animation:sumConf var(--d,1.6s) cubic-bezier(.15,.7,.4,1) forwards}
.sumov.quake .sumstage{animation:quake .3s}
@keyframes sumIn{from{opacity:0}}
@keyframes sumSpin{to{transform:rotate(360deg)}}
@keyframes sumFlash{0%{opacity:.95} 100%{opacity:0}}
@keyframes sumShake{0%,100%{transform:rotate(-5deg) scale(1)} 50%{transform:rotate(5deg) scale(1.07)}}
@keyframes sumPop{to{transform:scale(2.6); opacity:0; filter:brightness(6)}}
@keyframes sumRing{from{transform:scale(.4); opacity:1} to{transform:scale(7); opacity:0}}
@keyframes sumMote{from{transform:translate(var(--x), var(--y)) scale(1.3); opacity:0} 25%{opacity:1} to{transform:translate(0,0) scale(.2); opacity:.9}}
@keyframes sumMon{0%{transform:scale(.15); filter:brightness(0) drop-shadow(0 0 0 var(--c))} 55%{transform:scale(1.14); filter:brightness(0) drop-shadow(0 0 30px var(--c))} 75%{filter:brightness(3.5) drop-shadow(0 0 40px var(--c))} 100%{transform:none}}
@keyframes sumStar{from{transform:scale(3.4) rotate(-50deg); opacity:0}}
@keyframes sumUp{from{transform:translateY(14px); opacity:0}}
@keyframes sumPulse{50%{transform:scale(1.12)}}
@keyframes sumConf{from{transform:translate(0,0) rotate(0); opacity:1} 70%{opacity:1} to{transform:translate(var(--x), var(--y)) rotate(var(--r)); opacity:0}}
.reveal{display:grid; place-items:center; text-align:center; min-height:260px; padding:20px}
.reveal .stage{position:relative; display:grid; place-items:center; width:200px; height:170px; border-radius:50%; background:radial-gradient(ellipse at 50% 70%, #fff8dc, transparent 65%)}
.reveal .por{--sz:140px; border:0; animation:summon .9s cubic-bezier(.2,1.4,.4,1)}
.reveal .por:not(.img){--sz:110px; border-radius:50%}
.reveal .por.img{background:none}
.reveal .por:has(.pimg){--sz:150px; background:none; border:0; border-radius:0}
.reveal .por .pimg{background:none; padding:0}
.reveal h3{font-size:22px; margin-top:6px}
.glow4 .stage{background:radial-gradient(ellipse at 50% 70%, #e6d0ff, transparent 65%)}
.glow5 .stage{background:radial-gradient(ellipse at 50% 70%, #ffd38a, transparent 65%)}
@keyframes summon{0%{transform:scale(.1) rotate(-200deg); opacity:0; filter:brightness(4)} 100%{transform:none; opacity:1; filter:none}}

/* ---------- Pack d'assets ---------- */
.packgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:4px}
.packgrid li{display:flex; align-items:center; gap:6px; padding:3px 6px; background:var(--row); border-radius:4px; font-size:12px; min-width:0}
.packgrid li code{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.packgrid li.have{background:#d6e8c4}
.packgrid li i{font-style:normal; font-weight:bold; width:14px; text-align:center}
.filebtn{position:relative; overflow:hidden}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

/* ---------- Combat ---------- */
.cwin .wb{padding:6px}
.seg{display:inline-flex; border:1px solid #2a2926; border-radius:5px; overflow:hidden}
.seg button{background:linear-gradient(#77756e, #55544f); border:0; padding:2px 8px; cursor:pointer; color:#fff; font-weight:bold; font-size:11px}
.seg button + button{border-left:1px solid #2a2926}
.seg button[aria-pressed="true"]{background:linear-gradient(var(--orange), var(--orange2))}
.field{position:relative; aspect-ratio:16/8.2; border-radius:6px; overflow:hidden; border:1px solid #2a2926; background:#4d7a2a}
.field canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#fxcv{z-index:4000; pointer-events:none}
.field.quake{animation:quake .28s}
@keyframes quake{20%{transform:translate(-4px,2px)} 45%{transform:translate(4px,-2px)} 70%{transform:translate(-2px,1px)}}
.cast{position:absolute; left:50%; top:8px; transform:translateX(-50%); background:linear-gradient(var(--band), var(--band2)); color:#fff; border:1px solid #2a2926; border-radius:5px; padding:3px 14px; white-space:nowrap; opacity:0; transition:opacity .2s; pointer-events:none; z-index:4000; box-shadow:0 2px 6px #0006}
.cast.show{opacity:1}
.cast b{color:#ffcf6a}
.ftip{position:absolute; left:8px; top:8px; width:200px; z-index:3500; font-size:12px; box-shadow:0 3px 10px #0006}
.ftip .wt{min-height:24px; padding:3px 10px; justify-content:flex-start}
.ftip .wt h2{font-size:13px}
.ftip .rows li{padding:2px 7px}
.unit{position:absolute; left:0; top:0; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; width:96px; pointer-events:none}
.unit > *{pointer-events:auto}
.plate{width:100%; background:#f1eee2ee; border:1px solid #2a2926; border-radius:5px; padding:2px 5px 3px; display:grid; gap:2px; font-size:10.5px; box-shadow:0 2px 3px #0005; margin-bottom:3px}
.nm{display:flex; justify-content:space-between; gap:4px; font-weight:bold; white-space:nowrap; overflow:hidden}
.nm small{color:var(--ink2)}
.bar{position:relative; height:8px; border-radius:2px; background:#3d3c38; overflow:hidden; box-shadow:inset 0 1px 1px #000a}
.bar i{position:absolute; inset:0 auto 0 0; width:var(--w,100%); background:linear-gradient(var(--hp2), var(--hp)); transition:width .35s ease-out}
.bar span{position:absolute; inset:0; font-size:8px; line-height:8px; text-align:center; color:#fff; text-shadow:0 0 2px #000; font-weight:bold; font-variant-numeric:tabular-nums}
.bar.atb{height:3px}
.bar.atb i{background:var(--atb); transition:width var(--dur,.5s) linear}
.fx{display:flex; flex-wrap:wrap; gap:2px; min-height:11px}
.fx span{font-size:8.5px; line-height:11px; padding:0 3px; border-radius:2px; font-weight:bold}
.fx .good{background:#d3ebbf; color:#2a5c10}
.fx .bad{background:#f5cbbf; color:#8c2412}
.token{position:relative; width:var(--tok); height:var(--tok); border-radius:50%; border:2px solid #2a2926; cursor:default; padding:0; z-index:1;
  background:radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--elc) 38%, #fff) 0, var(--elc) 70%, color-mix(in srgb, var(--elc) 55%, #000) 100%);
  display:grid; place-items:center; font-weight:bold; font-size:calc(var(--tok) * .32); color:#fff; text-shadow:0 1px 0 #000a; transition:transform .2s, filter .3s}
.token.img{background:none; border:0; border-radius:0; width:calc(var(--tok) * 1.6); height:calc(var(--tok) * 1.6); margin-bottom:calc(var(--tok) * -.2)}
.token.img img{width:100%; height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 2px 0 #0004)}
.token .elb{--sz:var(--tok)}
.token .spr{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 2px 0 #0004); z-index:2}
.unit.sideB .spr{transform:scaleX(-1)}
/* les sprites respirent au repos ; la version B garde le retournement */
.token .spr{transform-origin:50% 100%; animation:idleA 2.6s ease-in-out infinite}
.unit.sideB .spr{animation-name:idleB}
.unit.dead .spr{animation:none}
@keyframes idleA{50%{transform:scale(1.025,.972)}}
@keyframes idleB{0%,100%{transform:scaleX(-1)} 50%{transform:scale(-1.025,.972)}}
/* barre de vie : une traînée claire rattrape la perte avec un temps de retard */
.bar.hp::before{content:''; position:absolute; inset:0 auto 0 0; width:var(--w,100%); background:#fff; opacity:.8; transition:width .75s ease-out .22s}
.unit{transition:opacity .45s, filter .45s}
.unit.dead .token{transition:transform .5s cubic-bezier(.5,0,.7,1)}
.unit.sideA{--in:-34px} .unit.sideB{--in:34px}
/* vraie map Dofus : pas de grosse plaque, juste les barres au-dessus de la tête et le cercle d'équipe au sol */
.field.real .plate{width:calc(var(--tok) * 1.15); min-width:44px; background:#0009; border-color:#000a; padding:2px; gap:1px; box-shadow:none; margin-bottom:1px}
.field.real .plate .nm{display:none; color:#fff; font-size:9.5px; text-shadow:0 1px 1px #000}
.field.real .plate .nm small{color:#ddd}
.field.real .unit.active .plate{background:#000c; border-color:var(--orange2)}
.field.real .unit.active .nm, .field.real .unit:hover .nm{display:flex}
.field.real .bar{height:6px} .field.real .bar span{display:none} .field.real .fx{min-height:0}
.field.real .ring{border-width:2px; box-shadow:0 2px 5px 1px #0009, inset 0 0 6px #0006}
.field.real .spr{filter:drop-shadow(0 3px 2px #0007)}
.token:has(.spr){--sp:calc(var(--tok) * 1.9 * var(--sz,1)); background:none; border:0; border-radius:0; width:var(--sp); height:var(--sp); margin-bottom:calc(var(--sp) * -.13)}
.token:has(.spr) > span:first-child, .token:has(.spr) .elb{visibility:hidden}
.unit.boss .token:has(.spr){--sp:calc(var(--tok) * 2.3 * var(--sz,1))}
.token.img .elb{display:none}
.unit.boss .token{width:calc(var(--tok) * 1.3); height:calc(var(--tok) * 1.3)}
.unit.boss .token.img{width:calc(var(--tok) * 2.1); height:calc(var(--tok) * 2.1)}
.ring{width:calc(var(--tok) * 1.15); height:calc(var(--tok) * .42); margin-top:calc(var(--tok) * -.26); border-radius:50%; border:3px solid var(--side); background:color-mix(in srgb, var(--side) 30%, transparent)}
.unit.boss .ring{width:calc(var(--tok) * 1.5)}
.unit.active .ring{border-color:#fff; box-shadow:0 0 0 2px var(--side), 0 0 10px 2px #fff}
.unit.active .plate{border-color:var(--orange2); background:#fff3d6}
.unit.active .token{animation:bob 1s ease-in-out infinite}
.unit.targetable .token{cursor:pointer}
.unit.targetable .ring{animation:pulse .9s ease-in-out infinite; border-color:#fff}
.unit.targetable .token:hover{transform:scale(1.07)}
.unit .tag{position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); font-size:9px; font-weight:bold; padding:0 5px; border-radius:3px; white-space:nowrap; display:none; text-transform:uppercase; z-index:2; border:1px solid #2a2926}
.unit.targetable.adv .tag{display:block; background:#d3ebbf; color:#24470d}
.unit.targetable.dis .tag{display:block; background:#f5cbbf; color:#7d1f0f}
.unit.dead{filter:grayscale(1) brightness(.8); opacity:.45}
.unit.dead .token{transform:rotate(-80deg) scale(.85)}
.unit.lungeA .token{animation:lungeA .35s ease-out}
.unit.lungeB .token{animation:lungeB .35s ease-out}
.unit.hit .token{animation:shake .3s}
.pop{position:absolute; left:calc(50% + var(--jx, 0px)); top:40%; transform:translateX(-50%); font-weight:bold; font-size:20px; white-space:nowrap; pointer-events:none; color:#ff3b1f; text-shadow:-1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 2px 3px #000a; animation:pop .95s ease-out forwards; z-index:300}
.pop.crit{font-size:26px; color:#ff7b00}
.pop.glance{color:#8a7f66; font-size:16px}
.pop.heal{color:#2f9b12}
.pop.info{font-size:13px; color:#2b4f80}
@keyframes pop{0%{opacity:0; transform:translate(-50%,6px) scale(.7)} 15%{opacity:1; transform:translate(-50%,-6px) scale(1.12)} 100%{opacity:0; transform:translate(-50%,-46px) scale(1)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--side), 0 0 12px 4px #fff}}
@keyframes lungeA{40%{transform:translate(24px,0) scale(1.05)}}
@keyframes lungeB{40%{transform:translate(-24px,0) scale(1.05)}}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(2px)}}

/* Commandes posées dans l'arène, en haut à gauche */
.fctrl{position:absolute; left:7px; top:7px; z-index:40; display:flex; gap:6px; align-items:center;
  background:#1a140ebb; border:1px solid #0008; border-radius:7px; padding:4px 5px; backdrop-filter:blur(2px)}
.fctrl .seg button{font-size:11px; padding:3px 7px}
.fctrl .btn.sm{min-height:22px; padding:2px 9px}
/* Ordre des tours puis sorts, sous l'arène et sur toute sa largeur */
.cwin .timeline{margin-top:6px}
.spellwrap{margin-top:6px}
/* Bandeau du bas (chat · portrait) */
.hudbar{display:grid; grid-template-columns:minmax(0,1fr) 150px auto; gap:8px; align-items:stretch; margin-top:6px}
.seedrow{display:grid; align-content:end; justify-items:end}
.chat{background:#eef0e4; border:1px solid #9ea08f; border-radius:6px; box-shadow:inset 0 1px 3px #0002; padding:4px 8px; height:170px; overflow:auto}
.chat ol{list-style:none; margin:0; padding:0; display:grid; gap:1px; font-size:11.5px}
.chat li{color:#2c4a17}
.chat li.dmg{color:#b2321c}
.chat li.heal{color:#2f7a10}
.chat li.sk{color:#1f3e66; font-weight:bold; margin-top:3px}
.chat li.kill{color:#8c1b0b; font-weight:bold}
.chat li.sys{color:#6b6657; font-style:italic}
.pcirc{display:grid; place-items:center; gap:4px; text-align:center}
.pcirc .face{position:relative; width:104px; height:104px; border-radius:50%; border:3px solid #2a2926; box-shadow:0 0 0 3px var(--win-hi), 0 0 0 4px var(--win-out); overflow:hidden; background:#ddd8c6; display:grid; place-items:center}
.pcirc .face .por{--sz:104px; border:0; border-radius:50%}
.heart{position:absolute; right:-14px; bottom:-4px; width:58px; height:50px; display:grid; place-items:center; font-weight:bold; font-size:10.5px; color:#fff; text-shadow:0 1px 1px #000}
.heart svg{position:absolute; inset:0; width:100%; height:100%}
.heart span{position:relative; margin-top:-3px}
.pcirc .who{font-weight:bold; font-size:12px}
.pcirc .wrapface{position:relative}
.vit{position:absolute; left:-8px; bottom:-2px; width:34px; height:34px; display:grid; place-items:center; font-weight:bold; font-size:10px; color:#3b2a00}
.vit svg{position:absolute; inset:0}
.vit span{position:relative}
.timeline{display:flex; gap:4px; padding:5px; overflow-x:auto}
.tl{position:relative; flex:none; display:grid; gap:2px; width:48px; padding:2px; border-radius:5px; background:#3d3c38; border:2px solid var(--side); transition:transform .2s}
.tl .por{--sz:40px; border:0; border-radius:3px}
.tl .hp, .tl .at{height:4px; border-radius:2px; background:#1e1d1b; overflow:hidden}
.tl .hp b, .tl .at b{display:block; height:100%; width:var(--w); background:var(--hp2); transition:width .3s}
.tl .at b{background:var(--atb); transition:width var(--dur,.5s) linear}
.tl.now{transform:translateY(-3px); box-shadow:0 0 0 2px #fff, 0 0 8px 2px var(--orange)}
.tl.dead{opacity:.3}
.spellbar{display:grid; grid-template-columns:repeat(3, 52px) minmax(0,1fr); gap:6px; padding:6px; align-items:start}
.spell{position:relative; width:52px; height:52px; padding:0; border-radius:8px; border:1px solid var(--slot-line); background:linear-gradient(var(--slot-hi), var(--slot)); cursor:pointer; display:grid; place-items:center}
.spell svg{width:44px; height:44px}
.spw{position:relative; display:inline-grid; place-items:center; line-height:0}
.spw .spimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; border-radius:8px}
.sklist .spw{grid-row:span 2}
.spell .k{position:absolute; left:2px; top:1px; font-size:9px; font-weight:bold; color:#fff; text-shadow:0 0 2px #000}
.spell .cdn{position:absolute; inset:0; display:grid; place-items:center; background:#000a; color:#fff; font-weight:bold; font-size:18px; border-radius:7px}
.spell[aria-pressed="true"]{border:2px solid var(--orange2); box-shadow:0 0 0 1px #fff, 0 0 8px var(--orange)}
.spell:disabled{cursor:not-allowed}
.spell:disabled:not(.oncd){filter:grayscale(.7); opacity:.6}
.spdesc{font-size:12px; min-width:0}
.spdesc b{display:block; font-size:13px}

/* ---------- Launcher : la capture de l'updater sert de décor. L'écran garde toujours les proportions de
   l'image (565 × 407) pour que les repères en pourcentage tombent juste ; le panneau de journal est un bloc
   séparé, posé par-dessus l'image sur grand écran, et renvoyé dessous en portrait où il serait illisible. */
.lau{position:fixed; inset:0; z-index:9000; display:grid; place-items:center; place-items:safe center; overflow:auto;
  background:#0d0a07 radial-gradient(ellipse at 50% -10%, #241b12, #0d0a07 70%);
  padding:max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom))}
.lau[hidden]{display:none}
.lauw{position:relative; width:min(640px, 100%); border-radius:10px; overflow:hidden; box-shadow:0 16px 44px #000c; color:#e9e4d8; background:#15100c}
.lauscreen{position:relative; width:100%; aspect-ratio:565/407;
  background:#15100c url("assets/launcher.jpg") center/100% 100% no-repeat}
/* la barre, posée exactement sur celle de l'image */
.laubar{position:absolute; left:4.07%; top:37.35%; width:92.9%; height:6.39%; border-radius:999px; overflow:hidden;
  background:linear-gradient(#17150f, #2a2620); box-shadow:inset 0 2px 5px #000c}
.laubar i{position:absolute; inset:0 auto 0 0; width:0; border-radius:999px;
  background:linear-gradient(#ffc264 0%, #f08a1e 45%, #d2691e 100%); box-shadow:inset 0 1px 0 #fff9; transition:width .4s ease-out}
.laubar span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2;
  font-size:clamp(9px, 2vw, 12.5px); font-weight:bold; color:#fff; text-shadow:0 1px 2px #000d}
.laubar em{position:absolute; right:2%; top:50%; translate:0 -50%; z-index:2; font-style:normal;
  font-size:clamp(9px, 2vw, 12.5px); font-weight:bold; color:#fff; text-shadow:0 1px 2px #000d}
/* l'œuf de l'image devient la zone cliquable */
.lauegg{position:absolute; left:83.7%; top:52.3%; width:13.1%; height:22.6%; z-index:3;
  border:0; background:none; padding:0; cursor:pointer; border-radius:50%/42%}
.lauegg:disabled{cursor:progress}
.lauegg .halo{position:absolute; inset:-14%; border-radius:50%; opacity:0; transition:opacity .25s;
  background:radial-gradient(circle, #ffd98a55, #0000 70%)}
.lauegg:not(:disabled) .halo{opacity:1; animation:eggGlow 2.4s ease-in-out infinite}
.lauegg:not(:disabled):hover .halo{opacity:1; background:radial-gradient(circle, #ffd98a99, #0000 72%)}
@keyframes eggGlow{50%{opacity:.4}}
.lauegg .play{position:absolute; left:50%; bottom:-26%; translate:-50% 0; white-space:nowrap;
  font-size:clamp(8px, 1.7vw, 11px); font-weight:bold; letter-spacing:.1em; text-transform:uppercase;
  color:#ffd98a; text-shadow:0 1px 3px #000c}
.laucog{position:absolute; left:86.5%; top:82%; width:7.5%; height:10.4%; z-index:3; border:0; background:none;
  padding:0; cursor:pointer; border-radius:50%}
.laucog:hover{filter:brightness(1.3)}
/* onglets + journal : posés sur l'image, à l'emplacement du panneau d'origine */
.lauside2{position:absolute; left:5.3%; top:45.4%; width:75.8%; z-index:4}
.lautabs{display:flex; gap:4px; padding-left:4px}
.lautabs button{font:inherit; font-size:clamp(9px, 1.9vw, 12.5px); font-weight:bold; padding:3px 12px;
  border:1px solid #2a2620; border-bottom:0; border-radius:7px 7px 0 0; cursor:pointer;
  background:linear-gradient(#6b655b, #4a453d); color:#ded7c6}
.lautabs button[aria-pressed="true"]{background:linear-gradient(#cbc7bc, #b9b5a9); color:#2a2520}
.laupan{height:clamp(96px, 23vw, 150px); overflow:auto; background:#c9c6bd; border:1px solid #2a2620; border-radius:3px;
  padding:6px 8px; color:#2f2d27; font-size:clamp(8.5px, 1.85vw, 12.5px); line-height:1.35; box-shadow:inset 0 2px 6px #00000055}
.laupan ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.laupan li{display:flex; gap:6px; align-items:baseline}
.laupan .d{color:#6f6a5c; flex:none}
.lauver{position:absolute; left:0; right:0; bottom:1%; text-align:center; font-size:9px; color:#8d8371; z-index:1}

/* Portrait : l'image garde ses proportions — sinon les repères en pourcentage tombent à côté — mais le
   journal descend sous elle, où il est lisible. */
@media (max-width: 560px){
  /* le panneau d'origine resterait visible dans l'image alors que le nôtre est passé dessous : on le masque */
  .lauscreen::after{content:""; position:absolute; left:3.5%; top:44%; width:78.5%; height:53%; border-radius:4px;
    background:#15100c; box-shadow:inset 0 0 14px #0009}
  .lauside2{position:static; width:auto; padding:8px 8px 0; background:#15100c}
  .lautabs button{padding:5px 14px; font-size:12px}
  .laupan{height:112px; font-size:12px; padding:7px 9px}
  .lauver{position:static; padding:6px 0 8px}
  .lauegg .play{bottom:-30%; font-size:10px}
}

/* Création : sa propre fenêtre, sans l'image de fond */
.crewrap{background:linear-gradient(#211a14, #15100c 60%, #1b1510); border:1px solid #000;
  box-shadow:inset 0 1px 0 #ffffff18, 0 16px 44px #000c}
.crewrap[hidden]{display:none}
/* Création : compte puis classe */
.cre{display:grid; gap:10px; padding:10px}
.cre .fld{display:grid; gap:5px}
.cre label{font-size:12px; color:#cfc8b8}
.cremsg{font-size:12px; color:#ffb760; background:#00000033; border-left:3px solid var(--orange2); border-radius:0 5px 5px 0; padding:6px 9px}
.cre input{font:inherit; font-size:16px; padding:8px 10px; border-radius:5px; border:1px solid #16150f; background:#e9e4d6; color:#2a2520; box-shadow:inset 0 1px 3px #0004}
/* Qualité du jet : la bordure dit d'un coup d'œil si la pièce vaut la peine */
.j-mediocre{border-color:#8a8578 !important} .j-correct{border-color:#3b8a17aa !important}
.j-bon{border-color:#2a69b8bb !important} .j-excellent{border-color:#8a44c4cc !important}
.j-parfait{border-color:var(--r-legendaire) !important; box-shadow:inset 0 0 8px #ff9a2e66, 0 0 6px #ff9a2e55 !important}
.gimg{object-fit:contain}
.top{justify-content:space-between; align-items:center}
.credit{flex-basis:100%; opacity:.75}
.pbadge{display:flex; align-items:center; gap:8px}
.pbadge:empty{display:none}
.pbadge .pb-t{display:grid; line-height:1.15; min-width:0}
.pbadge .pb-t b{font-size:13px; color:var(--ink)}
.pbadge .pb-t span{font-size:11px; color:var(--ink2)}
.crehead{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:11px; align-items:center;
  background:#00000038; border:1px solid #00000066; border-radius:9px; padding:9px 11px}
.sexseg{display:flex; gap:3px; flex:none}
.sexseg button{font:inherit; font-size:11.5px; padding:5px 10px; cursor:pointer; color:#ded7c6; border:1px solid #000;
  background:linear-gradient(#5a564e, #403e3a); border-radius:5px}
.sexseg button[aria-pressed="true"]{background:linear-gradient(#f0a94a, var(--orange2)); color:#fff; border-color:var(--orange-dk)}
/* avatar : l'emblème de classe en fond, le portrait par-dessus (il manque pour une classe ou deux côté DofusDB) */
.cls-av{position:relative; width:var(--av); height:var(--av); flex:none; display:grid; place-items:center; border-radius:50%;
  background:radial-gradient(circle at 50% 32%, #6d6760, #332f2a 72%); border:1px solid #00000088; box-shadow:inset 0 1px 0 #ffffff1f, 0 1px 3px #0006; overflow:hidden}
.cls-av .csym{position:absolute; opacity:.3; filter:grayscale(.3)}
.cls-av .chd{position:relative; z-index:1; image-rendering:auto; filter:drop-shadow(0 1px 2px #0008)}
.clsgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:7px; max-height:min(230px, 34vh); overflow:auto; padding:3px}
.clscard{display:grid; justify-items:center; gap:2px; text-align:center; padding:8px 5px 6px; border-radius:8px; cursor:pointer; font:inherit;
  background:linear-gradient(#54524e, #403e3a); border:1px solid #16150f; color:#e9e4d8}
.clscard b{font-size:12.5px; line-height:1.1}
.clscard .tag{font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:#ffb760}
.clscard[aria-pressed="true"]{background:linear-gradient(#f0a94a, var(--orange2)); border-color:var(--orange-dk); color:#fff; box-shadow:0 0 0 1px #fff4, 0 2px 8px #f0a94a55}
.clscard[aria-pressed="true"] .tag{color:#ffe9c4}
.clscard[aria-pressed="true"] .cls-av{border-color:#ffffff66}

/* Jouer : le hub des modes. Une carte par mode, avec son boss, sa couleur et son avancement. */
.mgrid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(278px, 1fr)); gap:10px}
.mcard{position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; text-align:left;
  padding:10px 12px 10px 17px; border:1px solid var(--win-out); border-radius:9px; cursor:pointer; font:inherit; color:var(--ink);
  background:linear-gradient(var(--row2), var(--row)); box-shadow:inset 0 1px 0 #fff9, 0 2px 6px #0003; overflow:hidden}
.mcard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--mc)}
.mcard:hover{border-color:var(--orange2); background:linear-gradient(#f2efe2, var(--row2))}
.mcard:disabled{opacity:.55; cursor:not-allowed}
.mc-art{position:relative; width:62px; height:62px; display:grid; place-items:center; border-radius:8px; flex:none; overflow:hidden;
  background:radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--mc) 34%, #fff) 0, color-mix(in srgb, var(--mc) 72%, #000) 100%);
  border:1px solid #0005; box-shadow:inset 0 0 10px #0004}
.mc-art .por{--sz:56px; background:none; border:0; box-shadow:none}
.mc-art .gemw{width:38px; height:38px}
.mc-body{display:grid; gap:3px; min-width:0}
.mc-t{font-size:16px; line-height:1.15}
.mc-s{font-size:12px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mc-n{font-size:11.5px; color:var(--ink2); font-weight:bold}
.elline{display:inline-flex; align-items:center; gap:5px}
.mc-go{font-size:24px; color:var(--ink2); line-height:1; opacity:.6}
.mcard .seg-bar{margin-top:1px}
@media (hover:none){ .mcard:hover{border-color:var(--win-out); background:linear-gradient(var(--row2), var(--row))} }

/* Fin de combat — en position fixe : l'arène est en overflow:hidden, un overlay absolu y était rogné dès que le bilan dépassait sa hauteur */
.over{position:fixed; inset:0; background:#1a120888; z-index:5000; overflow:auto; overscroll-behavior:contain;
  display:grid; place-items:center; place-items:safe center;   /* « safe » : ne rogne jamais le haut quand le bilan est plus grand que l'écran */
  padding:max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left))}
.over .win{width:min(760px, 100%)}
/* Modale : réutilise l'habillage de l'écran de fin */
.over.modal{background:#1a1208aa; cursor:pointer}
.over.modal .win{cursor:default}
.over.modal .grow{width:100%}
/* Équipe : équipement à gauche, caractéristiques à droite, collection en dessous */
.eqsplit{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:900px){ .eqsplit{grid-template-columns:1fr} }
/* Perdants nombreux : on garde le boss et on replie le reste derrière une rangée de portraits */
.morechips{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 10px; background:var(--row2); border:1px solid var(--panel-line); border-radius:6px; cursor:pointer; font:inherit; color:var(--ink)}
.morechips .stack{display:flex; padding-left:7px}
.morechips .por{margin-left:-7px; box-shadow:0 0 0 1px var(--win-out)}
.morechips b{color:var(--orange-dk)}
.morechips .go{margin-left:auto; color:var(--ink2); font-size:12px}
.modes{gap:4px; margin-bottom:8px}
.wb .modes{margin-bottom:0}
.resdot{display:inline-block; border-radius:3px; background:#e0a010; border:1px solid #7a4a00}
.shop{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.shop li{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:6px 10px; background:var(--row); border-radius:6px}
.shop li:nth-child(even){background:var(--row2)}
.shop li.done{opacity:.6}
.shop li > .achn:first-child{grid-column:1 / 3}
.shop .btn{display:inline-flex; align-items:center; gap:4px}
.fchips{display:flex; flex-wrap:wrap; gap:4px; margin-top:3px}
.fchip .por{--sz:34px}
.ehead{display:flex; gap:12px; align-items:center}
.ehead .por{--sz:110px; flex:none}
.eimg{flex:none; width:96px; height:96px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--slot-line); background:linear-gradient(var(--slot-hi), var(--slot))}
.eimg img{width:84px; height:84px; object-fit:contain}
.estats li span{display:inline-flex; align-items:center; gap:5px}
.mgrid .emore{grid-column:1 / -1; justify-self:center}
#egrid{max-height:62vh; overflow:auto}
.autobox{position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); width:min(290px, calc(100% - 24px)); z-index:8000; box-shadow:inset 0 0 0 3px var(--win-hi), 0 8px 24px #000a}
.autobox[hidden]{display:none}
.autobox .wb{display:grid; gap:5px; font-size:12px}
.autobar{width:100%; height:8px} .autobar b{width:0; animation:autoFill linear forwards}
@keyframes autoFill{to{width:100%}}
.autoloot{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.autoloot li{display:flex; flex-wrap:wrap; align-items:center; gap:4px}
.tabn{display:inline-block; min-width:16px; padding:0 4px; border-radius:8px; background:var(--foe); color:#fff; font-size:10px; line-height:16px; text-shadow:none}
.achs{list-style:none; margin:0; padding:0; display:grid; gap:4px}
.ach{display:grid; grid-template-columns:minmax(0,1fr) 150px auto; gap:10px; align-items:center; padding:6px 10px; background:var(--row); border:1px solid transparent; border-radius:6px}
.ach:nth-child(even){background:var(--row2)}
.ach.ready{border-color:var(--orange2); background:#fbe3bf}
.ach.done{opacity:.65}
.achp{display:grid; gap:2px; font-size:11px} .achp .xpbar{width:100%}
.achr .btn{display:inline-flex; align-items:center; gap:4px}
@media (max-width: 560px){ .ach{grid-template-columns:minmax(0,1fr) auto} .achp{grid-column:1 / -1; grid-row:2} }
.unit{animation:unitIn .35s ease-out}
@keyframes unitIn{from{opacity:0; translate:var(--in, 0) 0}}
.resscroll{overflow-x:auto}
.restab td, .restab th{white-space:nowrap}
.xpbar.dmgbar{width:60px} .xpbar.dmgbar b{background:linear-gradient(#ff8a6a, #c0281a)}
.restab{width:100%; border-collapse:collapse; font-size:12px}
.restab th{text-align:left; font-weight:normal; color:var(--ink2); padding:3px 6px; border-bottom:1px solid var(--panel-line)}
.restab td{padding:4px 6px; background:var(--row); vertical-align:middle}
.restab tr:nth-child(even) td{background:var(--row2)}
.restab .nmc{display:flex; align-items:center; gap:6px}
.xpbar{width:90px; height:7px; border-radius:2px; background:#3d3c38; overflow:hidden}
.xpbar b{display:block; height:100%; background:linear-gradient(#ffd27a, var(--orange2))}
.lootrow{display:flex; flex-wrap:wrap; gap:6px; padding:8px}
.lootrow .cell{cursor:default}
.lootrow .cell .q{background:var(--orange2)}

.foot{font-size:11px; color:#c9bfa9; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; border-top:1px solid #6a5d4d; padding-top:10px}
.importbox{width:100%; display:grid; gap:6px}
.importbox[hidden]{display:none}
.foot textarea{width:100%; min-height:70px; background:var(--panel); color:var(--ink); border:1px solid var(--win-out); border-radius:6px; font:11px ui-monospace, monospace; padding:6px}
.toast{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:linear-gradient(var(--band), var(--band2)); border:1px solid #2a2926; color:#fff; padding:7px 16px; border-radius:7px; font-weight:bold; z-index:9999; box-shadow:0 6px 18px #0008; max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

/* ---------- Tactile : cibles confortables, pas de surbrillance fantôme, pas de zoom au double-tap ---------- */
.btn, .tabs button, .spell, .cell, .tl, .prow, .x, .seg button, .morechips{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.field, .spellbar, .timeline, .doll, .tabs{-webkit-user-select:none; user-select:none}
@media (hover:none){   /* sans souris, :hover reste collé après un appui : on le neutralise */
  .cell:hover{border-color:var(--slot-line)}

}
@media (max-width: 380px){ .endbtns{grid-template-columns:1fr} }

/* ---------- Écran bas — typiquement le téléphone en paysage (~844 × 390).
   Ce cas se jouait jusqu'ici avec les règles « large » : l'arène gardait son ratio 16/8.2 et dépassait à elle seule
   la hauteur de l'écran. On raisonne donc en hauteur, pas en largeur : arène à gauche, commandes à droite,
   le tout tenant d'un bloc sans défilement. ---------- */
@media (max-height: 560px) and (min-width: 560px){
  :root{--tok:34px}
  .wrap{gap:6px; padding-block:6px calc(10px + env(safe-area-inset-bottom, 0px))}

  /* en paysage la hauteur manque : l'arène à gauche, l'ordre des tours et les sorts en colonne à droite */
  .cwin .wb{display:grid; grid-template-columns:minmax(0,1fr) clamp(214px, 30vw, 292px); gap:8px; align-items:start}
  .field{grid-row:1 / span 3; aspect-ratio:auto; height:calc(100vh - 96px); height:calc(100dvh - 96px); min-height:200px; max-height:460px}
  .cwin .timeline, .spellwrap{margin-top:0}
  .hudbar{margin-top:0; display:flex; flex-direction:column; gap:6px; min-width:0}
  .hudbar .pcirc, .hudbar .seedrow{display:none}     /* pas la place ; les plaques portent déjà l'info */
  .hudbar .chat{height:72px; grid-column:auto; grid-row:auto}
  .ftip{display:none}

  .timeline{padding:4px}
  .tl{width:40px} .tl .por{--sz:34px}
  .spellbar{grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; padding:5px}
  .spellbar .spell{width:100%; height:46px}
  .spellbar .spell svg{width:36px; height:36px}
  .spdesc{grid-column:1 / -1; font-size:11.5px}
  .spdesc b{font-size:12px}
  .unit{width:68px} .plate{font-size:9px; padding:1px 3px 2px}
  .nm small{display:none}
  .unit .tag{font-size:8px}

  .over .win{width:min(640px, 100%)}
  .restab .c-sec{display:none}
  /* hors combat : la largeur est abondante et la hauteur rare, on remet deux colonnes pour défiler moins */
  .split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:8px}
  .dlist{max-height:calc(100dvh - 190px)}
  .doll .cell{width:44px; height:44px} .doll .cell svg, .doll .cell img{width:36px; height:36px}
  .dcenter{min-height:140px}
}

const STAT = { hp:'PV', atk:'ATK', def:'DEF', spd:'VIT', crit:'Taux crit', critDmg:'Dégâts crit', acc:'Précision', res:'Résistance', hpPct:'PV', atkPct:'ATK', defPct:'DEF' };
const PCT = new Set(['hpPct','atkPct','defPct','crit','critDmg','acc','res']);
const MAIN = { atk:[2,16], def:[2,16], hp:[36,245], spd:[7,42], atkPct:[11,63], defPct:[11,63], hpPct:[11,63], crit:[7,58], critDmg:[11,80], acc:[12,64], res:[12,64] };
const SUB  = { hp:[14,38], atk:[1,2], def:[1,2], spd:[4,6], atkPct:[5,8], defPct:[5,8], hpPct:[5,8], crit:[4,6], critDmg:[4,7], acc:[4,8], res:[4,8] };
const SLOT_MAINS = { 1:['atk'], 2:['spd','atkPct','hpPct','defPct'], 3:['def'], 4:['crit','critDmg','atkPct','hpPct','defPct'], 5:['hp'], 6:['acc','res','atkPct','hpPct','defPct'] };
// ---------- Équipement : les vrais objets Dofus, lâchés en campagne, avec leur jet tiré au drop.
// Rien ne s'améliore ici — un objet vaut ce que son jet lui a donné, comme à la sortie d'un craft.
const GEAR_SLOTS = ['coiffe', 'amulette', 'arme', 'cape', 'anneau', 'anneau2', 'ceinture', 'bottes'];
const GEAR_LABEL = { coiffe:'Coiffe', cape:'Cape', amulette:'Amulette', anneau:'Anneau', anneau2:'Anneau', ceinture:'Ceinture', bottes:'Bottes', arme:'Arme' };
const GEAR_SRC = { anneau2:'anneau' };   // les deux anneaux puisent dans le même sac
// Caractéristique DofusDB → stat du jeu, avec son facteur d'échelle. Les valeurs de Dofus sont bien plus
// grandes que les nôtres (une coiffe donne +200 Vitalité quand un monstre a 760 PV) : ces facteurs les ramènent.
// Facteurs calibrés sur les vraies valeurs : les PV d'un monstre valent environ 30 × son niveau, et la somme
// brute des caractéristiques d'un set de huit pièces a été mesurée du niveau 10 au niveau 200. Avec ces facteurs,
// un set apporte ~25 % des PV du monstre au début et ~85 % en fin de jeu : l'équipement prend de l'importance
// à mesure qu'on progresse, au lieu de tout décider dès le premier donjon.
const CHAR_MAP = {
  11:['hp', 2.4], 10:['atk', .35], 15:['atk', .35], 13:['atk', .35], 25:['atk', .30],
  16:['atk', 6], 14:['spd', .22], 44:['spd', .03], 1:['spd', 8], 23:['spd', 5],
  12:['acc', .12], 18:['crit', 1.4],

const CHAR_NAME = { 1:'PA', 10:'Force', 11:'Vitalité', 12:'Sagesse', 13:'Chance', 14:'Agilité', 15:'Intelligence',
  16:'Dommages', 18:'Critique', 23:'PM', 25:'Puissance', 44:'Initiative' };
let GEAR = [], GEAR_BY_SLOT = {};
function indexGear(list){
  GEAR = list || [];
  GEAR_BY_SLOT = {};
  for (const g of GEAR) (GEAR_BY_SLOT[g.s] = GEAR_BY_SLOT[g.s] || []).push(g);
  for (const k in GEAR_BY_SLOT) GEAR_BY_SLOT[k].sort((a,b) => a.l - b.l);
}
const gearDef = it => it && GEAR.find(g => g.id === it.g);
// Qualité du jet : moyenne de la position de chaque ligne dans sa fourchette. Une ligne figée ne compte pas.
function gearJet(lines){
  let t = 0, n = 0;
  for (const l of lines){ if (l.b === l.a) continue; t += (l.v - l.a) / (l.b - l.a); n++; }
  return n ? t / n : 1;
}
const JET_LABEL = j => j >= .97 ? 'Parfait' : j >= .8 ? 'Excellent' : j >= .6 ? 'Bon' : j >= .35 ? 'Correct' : 'Médiocre';
const JET_CLASS = j => j >= .97 ? 'j-parfait' : j >= .8 ? 'j-excellent' : j >= .6 ? 'j-bon' : j >= .35 ? 'j-correct' : 'j-mediocre';
// Apport d'un objet aux stats du jeu
function gearStats(it){
  const out = {};
  for (const l of it.lines || []){
    const m = CHAR_MAP[l.c]; if (!m) continue;
    out[m[0]] = (out[m[0]] || 0) + l.v * m[1];
  }
  for (const k in out) out[k] = Math.round(out[k]);
  return out;
}
const gearName = it => { const d = gearDef(it); return d ? d.n : 'Objet'; };
const gearIcon = (it, sz = 42) => { const d = gearDef(it);
  return d && IMG_OK ? `<img class="gimg" src="${IMG_BASE}/items/${d.i}.png" alt="" width="${sz}" height="${sz}" loading="lazy" data-fb>`
                     : `<span class="resdot" style="width:${sz*.6}px;height:${sz*.6}px"></span>`; };
const gearLvl  = it => { const d = gearDef(it); return d ? d.l : 1; };

const RARITIES = ['normal','magique','rare','heroique','legendaire'];
const RAR_LABEL = { normal:'Normal', magique:'Magique', rare:'Rare', heroique:'Héroïque', legendaire:'Légendaire' };
const RAR_SUBS = { normal:0, magique:1, rare:2, heroique:3, legendaire:4 };
const UP_RATE = [100,100,95,90,80,70,60,50,40,35,30,25,20,15,10];   // chance de passer de +n à +n+1
const TROPHY_NAMES = { atk:'Trophée Puissant', def:'Trophée Robuste', hp:'Trophée Vital', spd:'Trophée Agile', crit:'Trophée Critique', critDmg:'Trophée Brutal', acc:'Trophée Sage', res:'Trophée Tenace' };
const DOFUS_NAMES  = { atk:'Dofus Ébène', def:'Dofus Ivoire', hp:'Dofus Émeraude', spd:'Dofus Ocre', crit:'Dofus Turquoise', critDmg:'Dofus Pourpre', acc:'Dofus Abyssal', res:'Dofus Cacao' };
