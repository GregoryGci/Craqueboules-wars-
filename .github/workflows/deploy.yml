# Génère le catalogue DofusDB et publie le jeu sur GitHub Pages à chaque push sur main.
# À activer une fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # rafraîchit le catalogue chaque lundi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire le catalogue
        run: node construire-catalogue.mjs
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html catalogue.json assets .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
