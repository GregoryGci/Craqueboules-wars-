# Génère le catalogue DofusDB et publie le jeu sur GitHub Pages à chaque push sur main.
# Pages s'active tout seul au premier run (enablement: true plus bas).
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # rafraîchit le catalogue chaque lundi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire le catalogue
        run: node construire-catalogue.mjs
      - name: Injecter les clés du serveur
        env:
          # Plusieurs noms acceptés : le secret peut avoir été créé sous l'une ou l'autre forme.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPA_ANON_KEY: ${{ secrets.SUPA_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node injecter-cles.mjs
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html catalogue.json assets .nojekyll _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # active GitHub Pages si ce n'est pas déjà fait (évite « Get Pages site failed »)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
